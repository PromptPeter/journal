<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Chat holen</title>
<style>
  body{ width:280px; margin:0; padding:14px; font:13px/1.5 -apple-system,Segoe UI,sans-serif;
        background:#0d1117; color:#e6e8ee; }
  h1{ font-size:14px; margin:0 0 4px; }
  p{ margin:0 0 12px; color:#9aa4b5; font-size:12px; }
  button{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid #2b3752;
          background:#4d7cfe; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:hover{ background:#5f8aff; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .status{ margin-top:10px; font-size:12px; color:#9aa4b5; min-height:16px; }
  .status.err{ color:#ffb4b6; }
  .status.ok{ color:#3ecf8e; }
  .pin-tip{ margin-top:12px; padding-top:10px; border-top:1px solid #2b3752;
            font-size:11px; color:#6b7690; }
</style>
</head>
<body>
  <h1>Chat holen</h1>
  <p id="hint">Auf einer Chat-Seite anklicken, um den sichtbaren Verlauf zu holen und ans Journal zu liefern.</p>
  <button id="grab" disabled>Chat holen</button>
  <div class="status" id="status"></div>
  <p class="pin-tip">Tipp: Symbol übers Erweiterungs-Puzzleteil in der Symbolleiste anpinnen (Stecknadel-Symbol daneben) — dann bleibt „Chat holen" immer sichtbar, ohne jedes Mal das Menü zu öffnen.</p>
  <script src="popup.js"></script>
</body>
</html>
