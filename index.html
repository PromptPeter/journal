<style>
/* ============================================================
   Design Tokens
   ============================================================ */
:root{
  --bg:            #05070d;
  --bg-grad:       radial-gradient(1200px 600px at 20% -10%, #16203a 0%, transparent 60%),
                   radial-gradient(900px 500px at 100% 0%, #0d1830 0%, transparent 55%);
  --surface:       #0b101c;
  --surface-2:     #111827;
  --surface-3:     #172033;
  --panel:         #0c1220;
  --line:          #1e2739;
  --line-soft:     #161e2e;
  --text:          #e8edf7;
  --text-2:        #9aa6bd;
  --text-3:        #66718a;
  --accent:        #4d7cfe;
  --accent-soft:   #4d7cfe22;
  --danger:        #f2555a;
  --ok:            #3ecf8e;
  --warn:          #e6a44e;

  --r-sm: 6px; --r-md: 9px; --r-lg: 14px; --r-pill: 999px;

  /* Anzeigedichte — Voreinstellung ist kompakt, damit mehr Einträge
     gleichzeitig lesbar sind. Umschaltbar im Kopf. */
  --card-py: 9px;  --card-px: 13px;
  --card-gap: 5px;
  --card-title: 13.5px;
  --card-snippet: 12.5px;
  --snippet-lines: 1;
  --card-meta: 10.5px;
  --card-date-size: 10px;
  --card-est: 58px;      /* Schätzhöhe für content-visibility (2 Zeilen) */
  --day-top: 7px;
  /* Symbolgrößen laufen mit der Dichte mit */
  --ico-expand: 12px;    /* Chevron auf der Karte      */
  --ico-ampel: 6px;      /* Ampelpunkt                 */
  --ico-dot: 5px;        /* Punkt im Modell-Badge      */
  --ico-node: 12px;      /* Chevron im Baum            */
  --ico-ring: 6px;       /* Ring am Ast                */
  --shadow-pop: 0 18px 48px -12px rgba(0,0,0,.75), 0 0 0 1px var(--line);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.16,1,.3,1);
}

/* Weite Darstellung: mehr Luft, zweizeiliger Auszug */
[data-density="cosy"]{
  --card-py: 14px; --card-px: 16px;
  --card-gap: 8px;
  --card-title: 14.5px;
  --card-snippet: 13px;
  --snippet-lines: 2;
  --card-meta: 11px;
  --card-date-size: 11px;
  --card-est: 122px;
  --day-top: 14px;
  --ico-expand: 15px;
  --ico-ampel: 7px;
  --ico-dot: 6px;
  --ico-node: 13px;
  --ico-ring: 7px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);
  background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#2a3448;border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#3a4761;background-clip:content-box}

.app{max-width:1180px;margin:0 auto;padding:0 24px 80px}

/* ---------- Masthead ---------- */
.masthead{display:flex;align-items:center;gap:14px;padding:26px 0 18px}
.logo{width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(145deg,var(--accent),#8b5cf6);display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 20px -6px var(--accent)}
.masthead h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.masthead .ver{margin-left:7px;font-size:10.5px;font-weight:500;color:var(--text-3);
  letter-spacing:.01em;vertical-align:1px}
.masthead p{margin:1px 0 0;font-size:12.5px;color:var(--text-3)}
.masthead .spacer{flex:1}
.langswitch{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);
  padding:2px;background:var(--surface);gap:2px}
.langswitch button{font-size:11px;font-weight:650;letter-spacing:.05em;color:var(--text-3);
  padding:4px 10px;border-radius:var(--r-pill);transition:background .15s,color .15s;
  display:grid;place-items:center;min-height:21px}
.langswitch button:hover{color:var(--text)}
.langswitch button.on{background:var(--accent);color:#fff}

.srv{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 11px;background:var(--surface)}
.srv .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none;transition:background .2s}
.srv.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.srv.off .dot{background:var(--danger)}

/* ---------- Filterbar ---------- */
.filterbar{position:sticky;top:0;z-index:60;margin:0 -24px;padding:12px 24px;
  background:rgba(5,7,13,.82);backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--line-soft)}
.filterbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.searchbox{position:relative;display:flex;align-items:center;gap:8px;height:38px;
  padding:0 10px 0 34px;min-width:250px;flex:1 1 280px;max-width:440px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox.invalid{border-color:var(--danger);box-shadow:0 0 0 3px #f2555a22}
.searchbox.invalid .op-tag{color:var(--danger)}
.searchbox>.ico{position:absolute;left:11px;color:var(--text-3);pointer-events:none}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13.5px}
.searchbox input::placeholder{color:var(--text-3)}
.searchbox .op-tag{flex:none;font-size:11px;color:var(--text-2);background:var(--surface-3);
  border-radius:var(--r-sm);padding:2px 7px;white-space:nowrap}

.trigger{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  color:var(--text-2);font-size:13.5px;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s}
.trigger:hover{border-color:#2b3752;color:var(--text)}
.trigger[aria-expanded="true"]{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.trigger.is-active{color:var(--text);border-color:#33415c;background:var(--surface-2)}
.trigger.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.trigger.primary:hover{background:#5f8aff;border-color:#5f8aff}
.trigger.import{background:var(--ok);border-color:var(--ok);color:#08150f}
.trigger.import:hover{background:#57e0a3;border-color:#57e0a3}
.trigger.import .chev{color:#08150f;opacity:.65}
.trigger .chev{transition:transform .18s var(--ease);color:var(--text-3);margin-left:-2px}
.trigger[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--text-2)}
.trigger .count{font-size:11px;font-weight:600;line-height:1;background:var(--accent);color:#fff;
  border-radius:var(--r-pill);padding:3px 6px;min-width:18px;text-align:center}
.trigger.primary .count{background:rgba(255,255,255,.25)}

.bar-sep{width:1px;height:22px;background:var(--line);flex:none}
.link-btn{font-size:12.5px;color:var(--text-3);padding:6px 8px;border-radius:var(--r-sm);
  display:inline-flex;align-items:center;gap:6px}
.link-btn:hover{color:var(--text);background:var(--surface-2)}
.link-btn[hidden]{display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 2px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 4px 3px 10px}
.chip b{font-weight:600;color:var(--text)}
.chip .x{width:17px;height:17px;display:grid;place-items:center;border-radius:50%;color:var(--text-3)}
.chip .x:hover{background:var(--surface-3);color:var(--text)}

/* ---------- Popover ---------- */
.pop{position:fixed;z-index:200;min-width:220px;max-width:min(360px,calc(100vw - 24px));
  background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:6px;
  opacity:0;transform:translateY(-6px) scale(.985);
  transition:opacity .14s var(--ease),transform .16s var(--ease);
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain}
.pop.open{opacity:1;transform:none}
.pop-search{position:relative;display:flex;align-items:center;margin:2px 2px 6px;flex:none}
.pop-search .ico{position:absolute;left:9px;color:var(--text-3);pointer-events:none}
.pop-search input{width:100%;height:32px;padding:0 10px 0 30px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);outline:none;font-size:13px}
.pop-search input:focus{border-color:var(--accent)}
.pop-list{overflow-y:auto;max-height:290px;min-height:0;margin:0;padding:0;list-style:none;flex:1 1 auto}
.opt{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);
  font-size:13.5px;color:var(--text-2);cursor:pointer;user-select:none;width:100%;text-align:left}
.opt:hover,.opt.cursor{background:var(--surface-3);color:var(--text)}
.opt[aria-selected="true"],.opt[aria-checked="true"]{color:var(--text)}
.opt .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .sub{font-size:11px;color:var(--text-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .n{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none}
.opt .tick{color:var(--accent);flex:none;opacity:0}
.opt[aria-selected="true"] .tick{opacity:1}
.opt .dot{width:7px;height:7px;border-radius:50%;flex:none}
.opt .fmt{width:34px;flex:none;font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--text-3);letter-spacing:.04em}
.cb{width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid #3a4661;
  display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s}
.opt[aria-checked="true"] .cb,.opt[aria-checked="mixed"] .cb{background:var(--accent);border-color:var(--accent);color:#fff}
.pop-sep{height:1px;background:var(--line);margin:6px 2px}
.pop-foot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:4px 2px 2px;flex:none}
.pop-foot .fill{flex:1;font-size:11.5px;color:var(--text-3)}
.btn{height:29px;padding:0 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#5f8aff}
.pop-empty{padding:16px 10px;text-align:center;font-size:12.5px;color:var(--text-3)}
.pop-hint{font-size:11px;color:var(--text-3);padding:2px 4px 6px}
.range{display:flex;gap:6px;padding:2px 2px 4px}
.range input{width:100%;height:31px;padding:0 8px;font-size:12.5px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);outline:none;color-scheme:dark}
.range input:focus{border-color:var(--accent)}

/* ---------- Toolbar + Liste ---------- */
.toolbar{display:flex;align-items:center;gap:12px;padding:18px 2px 12px}
.result-count{font-size:13px;color:var(--text-2)}
.result-count b{color:var(--text);font-variant-numeric:tabular-nums}
.toolbar .spacer{flex:1}
.timing{font-family:var(--mono);font-size:11px;color:var(--text-3)}

.daygroup{margin-bottom:var(--day-top)}
.dayhead{position:sticky;top:60px;z-index:20;display:flex;align-items:center;gap:9px;
  padding:5px 2px;margin-bottom:5px;background:linear-gradient(180deg,rgba(5,7,13,.95) 65%,transparent)}
.dayhead h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.dayhead .rule{flex:1;height:1px;background:var(--line-soft)}
.dayhead .n{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:var(--card-gap)}

/* Die Karte ist ein Raster. Kompakt wandern die Metadaten in die
   Titelzeile und füllen den Platz, den der Titel rechts frei lässt —
   das spart je Eintrag eine ganze Zeile. Weit stehen sie eigenständig
   darunter. Beide Fälle unterscheiden sich nur in den grid-areas. */
.card{display:grid;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-md);
  padding:var(--card-py) var(--card-px);cursor:pointer;
  align-items:center;column-gap:8px;row-gap:2px;
  grid-template-columns:auto minmax(4em,1fr) minmax(0,auto) auto auto;
  grid-template-areas:
    "model title meta date exp"
    "snip  snip  snip snip snip";
  transition:border-color .14s,background .14s}
[data-density="cosy"] .card{
  row-gap:4px;
  grid-template-areas:
    "model title title date exp"
    "snip  snip  snip  snip snip"
    "meta  meta  meta  meta meta";}
.card:hover{border-color:#2a3651;background:var(--surface-2)}

.model{grid-area:model;display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:var(--r-pill);
  border:1px solid currentColor;letter-spacing:.01em;white-space:nowrap}
.model .dot{width:var(--ico-dot);height:var(--ico-dot);border-radius:50%;background:currentColor}
.card-title{grid-area:title;min-width:0;font-size:var(--card-title);font-weight:550;
  color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
/* Voller Zeitstempel je Eintrag — monospace, damit die Spalte über alle
   Karten hinweg exakt untereinander steht */
.card-date{grid-area:date;font-family:var(--mono);font-size:var(--card-date-size);
  color:var(--text-3);white-space:nowrap;letter-spacing:-.02em}
.card-snippet{grid-area:snip;font-size:var(--card-snippet);color:var(--text-2);margin:0;
  line-height:1.45;display:-webkit-box;-webkit-line-clamp:var(--snippet-lines);
  -webkit-box-orient:vertical;overflow:hidden}

/* Kompakt: rechtsbündig an den Titel geschoben, überzählige Tags werden
   abgeschnitten statt umzubrechen. Weit: normale Zeile unter dem Auszug. */
.card-meta{grid-area:meta;display:flex;align-items:center;gap:5px;
  font-size:var(--card-meta);min-width:0;overflow:hidden;
  justify-self:end;flex-wrap:nowrap}
[data-density="cosy"] .card-meta{justify-self:start;flex-wrap:wrap;overflow:visible}
.tag{font-size:var(--card-meta);color:var(--text-3);background:var(--surface-3);
  border-radius:var(--r-sm);padding:1px 6px}
.tag:hover{color:var(--text)}
.cat{font-size:var(--card-meta);color:var(--text-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:1px 6px}
.ampel{width:var(--ico-ampel);height:var(--ico-ampel);border-radius:50%;display:inline-block;flex:none}
.ampel-ico{width:13px;height:13px;flex:none;border-radius:50%;
  background:conic-gradient(#3ecf8e 0 25%,#e6a44e 0 50%,#f2555a 0 75%,#4d7cfe 0)}
.okf-type{font-size:var(--card-meta);font-weight:700;letter-spacing:.05em;padding:1px 6px;
  border-radius:var(--r-sm);border:1px solid currentColor;flex:none}
/* Kennzeichnet Verläufe, deren Sprecherwechsel nicht ermittelbar waren */
.warn-tag{font-size:var(--card-meta);color:var(--warn);border:1px dashed currentColor;
  border-radius:var(--r-sm);padding:1px 6px;flex:none;cursor:help}
.opt .desc{font-size:11px;color:var(--text-3);display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* Optionen mit Leitfrage brauchen mehr Luft und Ausrichtung nach oben */
.opt.rich{align-items:flex-start;padding:9px 10px}
.opt.rich .cb,.opt.rich .dot{margin-top:2px}
.opt.rich .label{font-weight:650;letter-spacing:.03em;font-size:11.5px}
.opt.rich .desc{font-weight:400;letter-spacing:0;font-size:11.5px;white-space:normal;
  margin-top:2px;color:var(--text-2);line-height:1.42}
.opt .lead-q{display:block;font-size:11px;font-style:italic;color:var(--text-3);
  margin-top:3px;white-space:normal;line-height:1.4}
.opt.rich .n{margin-top:2px}
.pop-group{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);padding:8px 10px 4px}
.card-meta .stat{font-size:var(--card-meta);color:var(--text-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
[data-density="cosy"] .card-meta .stat{margin-left:auto}
/* In der Titelzeile ist die Kennzahl das Erste, was weichen darf */
.card-meta .tag,.card-meta .cat,.card-meta .okf-type,.card-meta .stat{flex:none}
mark{background:var(--accent-soft);color:#a9c2ff;border-radius:2px;padding:0 1px}

.empty{text-align:center;padding:70px 20px;color:var(--text-3);border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty h3{color:var(--text-2);font-size:15px;font-weight:550;margin:0 0 6px}
.empty p{margin:0 0 16px;font-size:13px}
.sentinel{height:1px}
.more{text-align:center;padding:16px;font-size:12.5px;color:var(--text-3)}

/* ---------- Inline-Baum (Gesprächsverlauf im selben Frame) ---------- */
.entry{display:flex;flex-direction:column}
.entry:not(.open){content-visibility:auto;contain-intrinsic-size:auto var(--card-est)}
.entry.open>.card{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;
  background:var(--surface-2)}
/* Aufgeklappt gilt immer die weite Darstellung — dort wird gelesen, nicht überflogen */
.entry.open>.card .card-snippet{-webkit-line-clamp:2;font-size:13px}
/* Breite/Höhe hier überschreiben die width/height-Attribute des SVG */
.card .expand{grid-area:exp;color:var(--text-3);transition:transform .2s var(--ease);
  width:var(--ico-expand);height:var(--ico-expand)}
.entry.open .card .expand{transform:rotate(180deg);color:var(--accent)}

.tree-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease)}
.entry.open .tree-wrap{grid-template-rows:1fr}
.tree-clip{overflow:hidden;min-height:0}
.tree{border:1px solid var(--accent);border-top:none;
  border-radius:0 0 var(--r-md) var(--r-md);background:var(--surface);padding:4px 16px 14px}

.tree-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 0 12px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.tree-bar .meta{font-size:11.5px;color:var(--text-3);margin-right:auto;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tree-bar .meta a{color:var(--text-2);text-decoration:none;border-bottom:1px dotted var(--text-3)}
.tree-bar .meta a:hover{color:var(--accent);border-color:var(--accent)}
.mini{height:25px;padding:0 9px;border-radius:var(--r-sm);font-size:11px;font-weight:600;
  font-family:var(--mono);letter-spacing:.03em;color:var(--text-3);border:1px solid var(--line)}
.mini:hover{color:var(--text);border-color:#33415c;background:var(--surface-2)}
.mini.nb{font-family:var(--font);letter-spacing:0;color:var(--accent);border-color:#2c3d66}
.mini.nb:hover{background:var(--accent-soft);color:#a9c2ff}

/* Strang: Zeitachse waagerecht, älter links, dieser Eintrag hervorgehoben.
   ref führt nach links (Vorgänger), refBy nach rechts (Nachfolger) —
   dieselbe Richtung, die im LLM-Wiki-Export zu [[Verweisen]] wird. */
.strand{display:flex;align-items:center;gap:9px;padding:9px 0 12px;
  border-bottom:1px solid var(--line-soft);margin-bottom:6px;
  overflow-x:auto}
.strand-caption{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);flex:none}
.strand-row{display:flex;align-items:center;gap:6px;flex:none}
.strand-fan{display:flex;flex-direction:column;gap:4px;flex:none}
.strand-pill{display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;flex:none;
  border-radius:var(--r-pill);border:1px solid currentColor;background:var(--surface-2);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;white-space:nowrap;cursor:pointer}
.strand-pill:hover{background:var(--accent-soft)}
.strand-pill:disabled{cursor:default;color:var(--text)!important;
  background:var(--accent-soft);border-color:var(--accent)}
.strand-id{font-weight:700}
.strand-ty{color:var(--text-3)}
.strand-pill:disabled .strand-ty{color:var(--accent)}
.strand-arrow{color:var(--text-3);flex:none}

@keyframes jumpFlash{from{box-shadow:0 0 0 3px var(--accent-soft)}to{box-shadow:0 0 0 0 transparent}}
.entry.jump-flash>.card{animation:jumpFlash 1.1s var(--ease)}

/* Baumstruktur: Stamm links, Äste je Turn */
.branches{position:relative;margin:0;padding:2px 0 0 0;list-style:none}
.branches::before{content:'';position:absolute;left:9px;top:0;bottom:14px;width:1px;background:var(--line)}
.branch{position:relative;padding-left:28px;margin-bottom:5px}
/* Ring sitzt mittig auf dem Stamm (9 px) und auf Höhe des Astes (16 px) */
.branch::before{content:'';position:absolute;left:9px;top:16px;width:15px;height:1px;background:var(--line)}
.branch::after{content:'';position:absolute;
  left:calc(9px - var(--ico-ring)/2 - 1.5px);
  top:calc(16px - var(--ico-ring)/2 - 1.5px);
  width:var(--ico-ring);height:var(--ico-ring);border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line)}
.branch.user::after{border-color:var(--accent)}
.branch.assistant::after{border-color:var(--ok)}
.branch:last-child{margin-bottom:0}

.node{width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  padding:7px 10px;border-radius:var(--r-md);font-size:12px;color:var(--text-3);
  border:1px solid transparent}
.node:hover{background:var(--surface-2);border-color:var(--line-soft);color:var(--text-2)}
.branch.on>.node{background:var(--surface-2);border-color:var(--line)}
.node .nr{font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:none;
  min-width:20px;font-variant-numeric:tabular-nums}
.node .role{font-weight:650;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:var(--r-sm);flex:none}
.branch.user .node .role{color:#9fc0ff;background:#4d7cfe22}
.branch.assistant .node .role{color:#8fe3bd;background:#3ecf8e1c}
.node .peek{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .when{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:-.02em;white-space:nowrap}
.tree-bar .stamp{font-family:var(--mono);letter-spacing:-.02em;color:var(--text-2)}
.node .caret{flex:none;transition:transform .2s var(--ease);
  width:var(--ico-node);height:var(--ico-node)}
.branch.on .node .caret{transform:rotate(180deg);color:var(--accent)}

.leaf-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--ease)}
.branch.on .leaf-wrap{grid-template-rows:1fr}
.leaf-clip{overflow:hidden;min-height:0}
.leaf{padding:9px 12px 13px;font-size:13.5px;line-height:1.62;color:var(--text-2);
  white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line);margin:2px 0 0 4px}
.branch.user .leaf{border-left-color:var(--accent)}
.branch.assistant .leaf{border-left-color:var(--ok)}
.leaf strong{color:var(--text);font-weight:600}
.leaf code{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);
  border-radius:4px;padding:1px 5px;color:#c9d6f0}
.leaf .li{padding-left:16px;position:relative;display:block}
.leaf .li::before{content:'·';position:absolute;left:5px;color:var(--accent)}
/* Metadaten-Editor */
.meta-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 0 11px;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
.edit-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3)}
.edit-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.etag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);
  background:var(--surface-3);border-radius:var(--r-sm);padding:2px 3px 2px 7px}
.etag .x{width:15px;height:15px;display:grid;place-items:center;border-radius:3px;color:var(--text-3)}
.etag .x:hover{background:var(--danger);color:#fff}
.tag-input{width:82px;height:23px;padding:0 7px;font-size:11px;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r-sm);outline:none;color:var(--text)}
.tag-input:focus{border-style:solid;border-color:var(--accent);width:150px}
.tag-input::placeholder{color:var(--text-3)}
.edit-sel{height:24px;padding:0 6px;font-size:11px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);outline:none;color:var(--text-2);
  max-width:200px}
.edit-sel:focus{border-color:var(--accent)}

.has-thought{flex:none;font-size:var(--card-meta);opacity:.85;line-height:1}
.thought{margin:6px 0 2px 4px;border-left:2px dashed #6b5cf6;background:#8b5cf60d;
  border-radius:0 var(--r-sm) var(--r-sm) 0}
.thought summary{cursor:pointer;padding:7px 12px;font-size:11.5px;color:#b9a7f5;list-style:none}
.thought summary::-webkit-details-marker{display:none}
.thought summary::before{content:'🧠 ';}
.thought summary:hover{color:#d3c6ff}
.thought[open] summary{border-bottom:1px solid #8b5cf622}
.thought-body{padding:9px 12px 12px;font-size:12.5px;line-height:1.6;color:#9c8fc4;
  white-space:pre-wrap;overflow-wrap:anywhere;font-style:italic}
.leaf-foot{display:flex;gap:8px;padding:0 0 4px 14px}
.leaf-foot button{font-size:11px;color:var(--text-3);padding:3px 7px;border-radius:var(--r-sm)}
.leaf-foot button:hover{background:var(--surface-3);color:var(--text)}

/* ---------- Drop-Zone ---------- */
.dropzone{position:fixed;inset:0;z-index:500;display:none;place-items:center;
  background:rgba(5,7,13,.9);backdrop-filter:blur(6px)}
.dropzone.on{display:grid}
.dropzone .inner{border:2px dashed var(--accent);border-radius:20px;padding:52px 70px;text-align:center}
.dropzone h3{margin:14px 0 6px;font-size:18px;color:var(--text)}
.dropzone p{margin:0;font-size:13px;color:var(--text-3)}

/* ---------- Geheimnis-Prüfung ---------- */
.scrim{position:fixed;inset:0;z-index:400;display:grid;place-items:center;
  background:rgba(2,4,9,.7);backdrop-filter:blur(4px);
  opacity:0;transition:opacity .18s var(--ease)}
.scrim.open{opacity:1}
.scan-dlg{width:min(620px,calc(100vw - 32px));max-height:min(80vh,700px);
  display:flex;flex-direction:column;background:var(--panel);
  border-radius:var(--r-lg);box-shadow:var(--shadow-pop);
  transform:translateY(8px) scale(.99);transition:transform .2s var(--ease)}
.scrim.open .scan-dlg{transform:none}
.scan-head{display:flex;align-items:center;gap:11px;padding:18px 22px 14px;
  border-bottom:1px solid var(--line-soft)}
.scan-icon{font-size:19px;color:var(--warn);line-height:1}
.scan-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
.scan-count{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.scan-body{overflow-y:auto;padding:16px 22px}
.scan-lead{margin:0 0 14px;font-size:13.5px;line-height:1.55;color:var(--text-2)}
.scan-table{display:flex;flex-direction:column;gap:3px}
.scan-row{display:grid;grid-template-columns:74px 1fr auto 110px;align-items:center;gap:10px;
  padding:7px 10px;border-radius:var(--r-sm);background:var(--surface);font-size:12.5px}
.scan-sev{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:var(--r-sm);text-align:center}
.sev-high   .scan-sev{color:#ffb4b6;background:#f2555a26}
.sev-medium .scan-sev{color:#f0c384;background:#e6a44e22}
.sev-low    .scan-sev{color:var(--text-3);background:var(--surface-3)}
.scan-what{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan-n{color:var(--text-3);font-variant-numeric:tabular-nums}
.scan-ex{font-family:var(--mono);font-size:11px;color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.scan-note{margin:14px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.5}
.scan-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px;
  border-top:1px solid var(--line-soft)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:#f2555a1a;color:#ffb4b6}
.secret-tag{font-size:var(--card-meta);color:var(--danger);border:1px solid currentColor;
  border-radius:var(--r-sm);padding:1px 6px;flex:none;cursor:help}

/* ---------- Chat einfügen (Paste-Import) ---------- */
.paste-dlg{width:min(560px,calc(100vw - 32px));display:flex;flex-direction:column;
  background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);
  transform:translateY(8px) scale(.99);transition:transform .2s var(--ease)}
.scrim.open .paste-dlg{transform:none}
.paste-body{padding:16px 22px;display:flex;flex-direction:column;gap:12px}
.paste-hint{margin:0;font-size:12.5px;line-height:1.55;color:var(--text-3)}
.paste-field{display:flex;flex-direction:column;gap:5px}
.paste-field label{font-size:12px;color:var(--text-2);font-weight:600}
.paste-field select,.paste-field textarea{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-sm);padding:8px 10px;font-size:13px;color:var(--text);resize:vertical}
.paste-field textarea{min-height:220px;font-family:var(--mono);line-height:1.5}
.paste-field select:focus,.paste-field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.paste-field button{align-self:flex-start;display:inline-flex;align-items:center;gap:6px}
.paste-field button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Toast ---------- */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:600;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 16px;font-size:13px;color:var(--text);box-shadow:var(--shadow-pop);
  display:flex;align-items:center;gap:9px;animation:rise .22s var(--ease)}
.toast.err{border-color:var(--danger);color:#ffb4b6}
.toast.ok .ic{color:var(--ok)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:640px){
  .app{padding:0 14px 60px}
  .filterbar{margin:0 -14px;padding:10px 14px}
  .searchbox{max-width:none;flex-basis:100%}
  .dayhead{top:58px}
  .tree{padding:4px 10px 12px}
  .branch{padding-left:22px}
  .node .when{display:none}
}
@media print{
  body{background:#fff;color:#000}
  .filterbar,.masthead,.toolbar,.toasts,.tree-bar{display:none!important}
  .tree-wrap{grid-template-rows:1fr!important}
  .leaf-wrap{grid-template-rows:1fr!important}
}
</style>
</head>

<div class="app">
  <header class="masthead">
    <div class="logo"><svg width="17" height="17"><use href="#i-spark"/></svg></div>
    <div>
      <h1><span class="ttl">PromptEngineer · Journal</span><span class="ver" id="app-ver"></span></h1>
      <p id="corpus-line">Lade Korpus …</p>
    </div>
    <div class="spacer"></div>
    <div class="langswitch" role="group" id="density" aria-label="Density">
      <button data-density="compact" type="button">
        <svg width="13" height="13"><use href="#i-dense"/></svg></button>
      <button data-density="cosy" type="button">
        <svg width="13" height="13"><use href="#i-cosy"/></svg></button>
    </div>
    <div class="langswitch" role="group" id="langswitch" aria-label="Language">
      <button data-lang="en" type="button">EN</button>
      <button data-lang="de" type="button">DE</button>

    <span class="srv" id="srv">
      <span class="dot"></span><span id="srv-txt"></span>
    </span>
  </header>

  <nav class="filterbar" aria-label="Filter">
    <div class="filterbar-row">
      <div class="searchbox">
        <svg class="ico" width="14" height="14"><use href="#i-search"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false">
        <button class="op-tag" id="op-trigger" aria-haspopup="listbox" aria-expanded="false"></button>
      </div>

      <button class="trigger" id="t-model" aria-haspopup="listbox" aria-expanded="false">
        <svg width="14" height="14"><use href="#i-model"/></svg><span class="lbl"></span>
        <svg class="chev" width="14" height="14"><use href="#i-chev"/></svg></button>

      <button class="trigger" id="t-type" aria-haspopup="listbox" aria-expanded="false">
        <svg width="14" height="14"><use href="#i-folder"/></svg><span class="lbl"></span>
        <svg class="chev" width="14" height="14"><use href="#i-chev"/></svg></button>

      <button class="trigger" id="t-cat" aria-haspopup="listbox" aria-expanded="false">
        <svg width="14" height="14"><use href="#i-book"/></svg><span class="lbl"></span>

      <button class="trigger" id="t-ampel" aria-haspopup="listbox" aria-expanded="false">

      <span class="bar-sep"></span>

      <button class="trigger" id="t-sort" aria-haspopup="listbox" aria-expanded="false">
        <svg width="14" height="14"><use href="#i-sort"/></svg><span class="lbl"></span>
        <svg class="chev" width="14" height="14"><use href="#i-chev"/></svg></button>

      <button class="trigger primary" id="t-export" aria-haspopup="listbox" aria-expanded="false">
        <svg width="14" height="14"><use href="#i-up"/></svg><span class="lbl"></span>
        <svg class="chev" width="14" height="14"><use href="#i-chev"/></svg></button>

      <button class="trigger import" id="import-btn" aria-haspopup="listbox" aria-expanded="false">

/** Übersetzt einen Schlüssel; {platzhalter} werden ersetzt. */
function t(key, vars){
  const entry = T[key];
  let s = entry ? (entry[LANG] ?? entry.en) : key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}
/** Übersetzt ein zweisprachiges Feld aus den Stammdaten. */
const tx = v => (v && typeof v === 'object') ? (v[LANG] ?? v.en) : v;

/** Tooltip für einen OKF-Typ: Beschreibung, Leitfrage und die unveränderte ID. */
function typeTooltip(id){
  const x = TYPE_BY_ID.get(id);
  if (!x) return id;
  return `${tx(x.name)} — ${tx(x.desc)}\n${tx(x.q)}\n(OKF-ID: ${x.id})`;
}

const MODEL_BY_ID = new Map(MODELS.map(m => [m.id, m]));

/** Modell aus Ordnername, Titel-Prefix [GEMINI] oder Quell-URL bestimmen. */
function detectModel({ folder, title, url, hint } = {}){
  const byFolder = folder && MODELS.find(m => m.id === String(folder).toLowerCase().replace(/[\s_-]/g,''));
  if (byFolder) return byFolder.id;
  if (url)   { const m = MODELS.find(x => x.host.test(url));   if (m) return m.id; }
  const tag = title && title.match(/^\s*\[([^\]]+)\]/);
  if (tag)   { const m = MODELS.find(x => x.match.test(tag[1])); if (m) return m.id; }
  for (const src of [hint, title]){
    if (!src) continue;
    const m = MODELS.find(x => x.match.test(src));
    if (m) return m.id;
  }
  return 'unbekannt';
}

/** Kategorie aus Ordnername, Titel und Inhalt ableiten. */
function guessCategory(title, text, folder){
  const f = String(folder || '').toLowerCase();
  if (/prompt/.test(f))            return 'prompt';
  if (/skil/.test(f))              return 'skill';    // md_sklils
  if (/workflow/.test(f))          return 'workflow';
  if (/note|notiz/.test(f))        return 'note';
  const t = (title + ' ' + String(text).slice(0, 1200)).toLowerCase();
  if (/\bskill\b|skill-erstellung/.test(t))       return 'skill';
  if (/workflow|pipeline|ablauf/.test(t))         return 'workflow';
  if (/\bprompt\b|system.?prompt/.test(t))        return 'prompt';
  if (/\bnotiz\b|memo|gedanke/.test(t))           return 'note';
  return 'chat';
}
/** Normalisiert Ampel-Schreibweisen (grün/GRÜN/gruen → "Gruen"). */
function normAmpel(v){
  if (!v) return null;
  const s = String(v).trim().toLowerCase()
    .replace(/ü/g,'ue').replace(/ä/g,'ae').replace(/ö/g,'oe');
  return AMPELN.find(a => a.id.toLowerCase() === s)?.id || null;
}

/* ═══════════════════════════════════════════════════════════════
   TEIL 2 · Import-Parser
   Erkennt das Markdown-Format deiner Chat-Exporte:
       # **Titel**
       [https://…](https://…)
       *User prompt: …*
       Response: …
       ---
   Zusätzlich: OKF-JSON ({ entries: [...] }).
   ═══════════════════════════════════════════════════════════════ */

/** Repariert Mojibake (UTF-8 fälschlich als Latin-1 gelesen: "Ã¤" → "ä"). */
function fixMojibake(s){
  if (!/Ã[-¿¤¶ÃŸ¼\w]|â€|Ã¼|Ã¶|Ã¤|ÃŸ/.test(s)) return s;
  try {
    const bytes = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      if (c > 255) return s;              // enthält echtes Unicode → nicht anfassen
      bytes[i] = c;
    }
    return new TextDecoder('utf-8', { fatal:true }).decode(bytes);
  } catch { return s; }
}

/** Entfernt Backslash-Escapes, die Export-Tools ins Markdown schreiben ("Absolut\!" → "Absolut!"). */
const unescapeMd = s => String(s).replace(/\\([\\`*_{}\[\]()#+\-.!>|~])/g, '$1');

const stripMd = s => unescapeMd(String(s)
  .replace(/^#{1,6}\s+/, '')
  .replace(/\*\*(.*?)\*\*/g, '$1')
  .replace(/^\*+|\*+$/g, '')).trim();

/**
 * Trennt den Denkfluss (Chain of Thought) vom eigentlichen Antworttext.
 * Erkennt <think>/<thinking>-Tags sowie einen ausgewiesenen Denkprozess-Block.
 * Ergebnis: { text, thought } — thought ist null, wenn keiner vorhanden ist.
 */
function splitThought(raw){
  let text = String(raw), thought = null;
  const tag = text.match(/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/i);
  if (tag){
    thought = tag[1].trim();
    text = text.replace(tag[0], '').trim();
  } else {
    const block = text.match(/^\s*(?:\*\*)?(?:Denkprozess|Denkfluss|Gedankengang|Chain of Thought|Reasoning)(?:\*\*)?\s*:\s*([\s\S]*?)(?=\n\s*\n|$)/i);
    if (block){
      thought = block[1].trim();
      text = text.replace(block[0], '').trim();
    }
  }
  return { text, thought: thought || null };
}

/**
 * Zerlegt einen Markdown-Chatexport in Chat + Turns.
 * @returns {object|null}
 */
function parseChatMarkdown(raw, meta = {}){
  const text = fixMojibake(raw).replace(/\r\n?/g, '\n');
  const lines = text.split('\n');

  // --- Kopf: Titel + Quell-URL ---
  let title = '', url = '', bodyStart = 0;
  for (let i = 0; i < Math.min(lines.length, 12); i++){
    const l = lines[i].trim();
    if (!title && /^#{1,3}\s/.test(l)){ title = stripMd(l); bodyStart = i + 1; continue; }
    const link = l.match(/^\[?(https?:\/\/[^\]\s)]+)\]?(?:\(([^)]+)\))?$/);
    if (title && !url && link){ url = link[1]; bodyStart = i + 1; break; }
    if (title && l && !link && i > bodyStart) break;
  }
  if (!title) title = stripMd(meta.filename || 'Ohne Titel').replace(/\.(md|markdown|txt)$/i, '');

  // --- Turns: an Trennlinien splitten, dann User/Response herauslösen ---
  const body = lines.slice(bodyStart).join('\n');
  const blocks = body.split(/\n\s*(?:---|\*\*\*|___)\s*\n/);
  const turns = [];
  let markers = 0;              // wie oft ein echter Sprecherwechsel erkannt wurde

  for (const block of blocks){
    if (!block.trim()) continue;
    // "*User prompt: …*"  (auch mehrzeilig, auch ohne schließendes *)
    const uMatch = block.match(/^[\s\S]*?\*User prompt:\s*([\s\S]*?)\*?\s*(?=\n\s*\n|\n#{1,6}\s|\nResponse:|$)/i);
    // "Response:" – optional mit Heading und Fettung davor
    const rIdx = block.search(/(?:^|\n)\s*(?:#{1,6}\s*)?(?:\*\*)?Response(?:\*\*)?\s*:/i);

    const addTurn = (role, body) => {
      const { text, thought } = splitThought(unescapeMd(body.trim()));
      if (text || thought) turns.push({ role, text, thought });
    };

    if (uMatch && uMatch[1] != null && uMatch[1].trim()){ addTurn('user', uMatch[1]); markers++; }
    if (rIdx >= 0){
      const after = block.slice(rIdx).replace(/^[\s\S]*?Response(?:\*\*)?\s*:/i, '').trim();
      if (after){ addTurn('assistant', after); markers++; }
    }
    // Fallback: Block ohne Marker → als Assistant-Text übernehmen
    if (!uMatch && rIdx < 0 && block.trim().length > 20) addTurn('assistant', block);
  }

  if (!turns.length) return null;

  /* Wurde kein einziger Sprecherwechsel erkannt, liegt ein roher
     Copy-Paste-Verlauf vor: die Zuordnung „wer sagt was" steht nicht in
     der Datei. Sie zu raten wäre schlimmer als sie wegzulassen — ein
     Journal, dessen Rollen erfunden sind, ist wertlos. Der Text kommt
     deshalb als ein einziger, ausdrücklich als unstrukturiert
     gekennzeichneter Eintrag herein: durchsuchbar, aber ohne
     vorgetäuschte Struktur. */
  const unstructured = markers === 0 && turns.length > 1;
  if (unstructured){
    const all = turns.map(t => t.text).join('\n\n');
    turns.length = 0;
    turns.push({ role:'assistant', text: all, thought: null });
  }

  const modelId = detectModel({ folder:meta.folder, title, url, hint:meta.path });
  const ts = meta.ts || Date.now();

  return normalizeChat({
    title: title.replace(/^\s*\[[^\]]+\]\s*/, ''),   // "[GEMINI] Titel" → "Titel"
    url, modelId, ts, turns, unstructured,
    typeId: 'CHAT',
    catId: meta.catId || guessCategory(title, turns.map(t => t.text).join(' '), meta.folder || meta.path),
    tags: meta.tags || autoTags(title + ' ' + turns.map(t => t.text).join(' ')),
    source: meta.filename || null,
  });
}

/**
 * Ampel eines OKF-Eintrags lesen — akzeptiert beide Feldformen:
 * `kategorie` (Richards Server, OKF_MD_LOG) und `tags: ["ampel/…"]`
 * (Googles Schema, seit 25.08.2026 die Schreibrichtung des Journals).
 * Reine Lesefunktion, damit ältere Dateien weiter importierbar bleiben.
 */
function ampelFromEntry(e){
  if (e.kategorie) return e.kategorie;
  const hit = (e.tags || []).find(t => /^ampel\//.test(t));
  return hit ? hit.slice(6) : e.ampel;
}

/**
 * Liest die JSON-Formate des OKF-Projekts:
 *   · data.okf.json  → [{ id, type, text, timestamp, ref?, llm? }]  (typisiert, mit Referenzgraph)
 *   · raw.okf.json   → [{ role?, text, url?, timestamp, llm?, tags? }]  (Roh-Verlauf)
 *   · eigener Export → { chats:[{ …, turns:[…] }] }
 */
function parseOkfJson(raw, meta = {}){
  let data; try { data = JSON.parse(raw); } catch { return []; }
  const entries = Array.isArray(data) ? data : (data.entries || data.chats || []);
  if (!entries.length) return [];

  // --- data.okf.json: typisierte Einträge mit ref-Graph ---
  const typed = entries.filter(e => e && TYPE_BY_ID.has(String(e.type || '').toUpperCase()));
  if (typed.length && typed.length >= entries.length * 0.6){
    return parseOkfTyped(entries, meta);
  }

  // Bereits gruppierte Chats (mit turns/messages)?
  if (entries[0] && (entries[0].turns || entries[0].messages)){
    return entries.map(e => normalizeChat({
      title: e.title || e.name || 'Ohne Titel',
      url: e.url || '',
      modelId: detectModel({ title:e.title, url:e.url, hint:e.llm || e.model }),
      ts: toTs(e.timestamp || e.ts || e.created_at) || meta.ts || Date.now(),
      typeId: TYPE_BY_ID.has(String(e.type || '').toUpperCase()) ? String(e.type).toUpperCase() : 'CHAT',
      ampel: normAmpel(ampelFromEntry(e)),
      tags: e.tags || autoTags(e.title || ''),
      turns: (e.turns || e.messages).map(t => {
        const sp = splitThought(fixMojibake(String(t.text ?? t.content ?? '')));
        return {
          role: /assistant|model|ai|bot/i.test(t.role || '') ? 'assistant' : 'user',
          text: sp.text,
          thought: t.thought_process || t.thought || t.reasoning || sp.thought || null,
          ts: toTs(t.timestamp || t.ts),
        };
      }).filter(t => t.text || t.thought),
      source: meta.filename,
    })).filter(c => c.turns.length);
  }

  // Flache raw.okf.json → nach url/ref/Tag gruppieren, sonst nach Tag+Modell
  const groups = new Map();
  for (const e of entries){
    const text = fixMojibake(String(e.text ?? e.content ?? ''));
    if (!text) continue;
    const ts = toTs(e.timestamp || e.ts) || meta.ts || Date.now();
    const url = e.url || e.ref || '';
    const llm = e.llm || e.model || '';
    const key = url || `${llm}|${new Date(ts).toISOString().slice(0,10)}`;
    if (!groups.has(key)) groups.set(key, { url, llm, ts, kategorie:normAmpel(ampelFromEntry(e)), turns:[] });
    const g = groups.get(key);
    g.ts = Math.min(g.ts, ts);
    if (!g.kategorie) g.kategorie = normAmpel(ampelFromEntry(e));
    const sp = splitThought(text);
    g.turns.push({
      role: /assistant|model|ai|bot|response/i.test(e.role || e.type || '') ? 'assistant' : 'user',
      text: sp.text,
      thought: e.thought_process || e.thought || e.reasoning || sp.thought || null,
      ts,
    });
  }

  return [...groups.values()].map(g => {
    const first = g.turns[0]?.text || '';
    return normalizeChat({
      title: firstLine(first, 90),
      url: g.url,
      modelId: detectModel({ url:g.url, hint:g.llm }),
      ts: g.ts,
      typeId: 'CHAT',
      ampel: g.kategorie,
      tags: autoTags(g.turns.map(t => t.text).join(' ')),
      turns: g.turns.sort((a,b) => (a.ts||0) - (b.ts||0)),
      source: meta.filename,
    });
  });
}

/**
 * data.okf.json → ein Journaleintrag je typisiertem OKF-Eintrag.
 * Vorgänger (`ref`) und Nachfolger (`refBy`) werden nicht mehr als
 * Turns simuliert — TEIL 8 zeigt den Strang stattdessen als eigenes
 * Element im Baum (buildStrand()), verlinkt statt eingebettet.
 */
function parseOkfTyped(entries, meta = {}){
  // eingehende Verweise sammeln → wer verweist auf wen
  const incoming = new Map();
  for (const e of entries){
    if (!e?.ref) continue;
    if (!incoming.has(e.ref)) incoming.set(e.ref, []);
    incoming.get(e.ref).push(e.id);
  }

  const byId = new Map(entries.map(e => [e.id, e]));

  const out = [];
  for (const e of entries){
    if (!e || !e.text) continue;
    const type = String(e.type || 'CHAT').toUpperCase();
    const ts = toTs(e.timestamp) || meta.ts || Date.now();
    const text = fixMojibake(String(e.text));

    // "Text — weil Begründung" auftrennen (addEntry setzt das so zusammen)
    const weil = text.match(/^([\s\S]*?)\s+—\s+weil\s+([\s\S]+)$/);
    const turns = [{
      role:'user', ts,
      text: weil ? weil[1].trim() : text,
      thought: e.thought_process || e.thought || null,
    }];
    if (weil) turns.push({ role:'assistant', ts, text:'weil ' + weil[2].trim(), thought:null });

    // Kette der Vorgänger über ref anhängen (max. 12 Glieder gegen Zyklen).
    // Das ist reine Anzeige — folgt bewusst der eigenen ref-Richtung
    // (rückwärts), damit der Baum den Gedankenstrang so zeigt, wie er
    // entstanden ist. Mit der Verdichtung (compactOkf, incoming-Richtung)
    // hat das nichts zu tun.
    let cur = e.ref, guard = 0;
    while (cur && byId.has(cur) && guard++ < 12){
      const p = byId.get(cur);
      turns.push({
        role:'assistant', ts: toTs(p.timestamp) || ts,
        text: `↳ [${p.id}] ${String(p.type || '').toUpperCase()}: ${fixMojibake(String(p.text || ''))}`,
        thought: null,
      });
      cur = p.ref;
    }

    out.push(normalizeChat({
      title: `[${e.id}] ${firstLine(weil ? weil[1] : text, 90)}`,
      url: e.url || '',
      modelId: detectModel({ folder:meta.folder, hint:e.llm, url:e.url }),
      typeId: TYPE_BY_ID.has(type) ? type : 'CHAT',
      ampel: normAmpel(ampelFromEntry(e)),
      tags: autoTags(text),
      ts, turns,
      okfId: e.id,
      ref: e.ref || null,
      refBy: incoming.get(e.id) || [],
      source: meta.filename,
    }));
  }
  return out;
}

/**
 * Faltet eingerückte Fortsetzungszeilen in ihren Listeneintrag.
 * In einer echten VERLAUF.md laufen Einträge über mehrere Zeilen:
 *     - `21:41` [e01] **MOTIV** Richard will einen Logging-Skill, weil
 *       Zusammenfassungen die Motivationslage überdecken. ↳e00
 * Ohne dieses Falten liest der Parser nur den ersten Zeilenteil.
 */
function foldContinuations(text){
  const out = [];
  for (const line of text.split('\n')){
    const isCont = /^\s{2,}\S/.test(line);
    const prevIsItem = out.length && /^\s*-\s/.test(out[out.length - 1]);
    if (isCont && prevIsItem) out[out.length - 1] += ' ' + line.trim();
    else out.push(line);
  }
  return out;
}

/**
 * VERLAUF.md → Einträge. Gelesen werden der Abschnitt *Sitzungen*
 * und zusätzlich *Wände*, weil eine Wand nach der Verdichtung dort
 * stehen bleibt, auch wenn ihre Sitzung längst weggefallen ist
 * (SKILL.md, Regel 2). Dubletten werden über die ID ausgeschlossen.
 *
 * Eintragsformat:  - `HH:MM` [e01] **TYP** Ein Satz — mit dem Weil. ↳e00
 * Sitzungskopf:    ### YYYY-MM-DD (Tue)
 */
function parseVerlaufMd(raw, meta = {}){
  // Code-Blöcke zuerst entfernen: Dokumentation wie SKILL.md zeigt das
  // VERLAUF-Format als Beispiel und wäre sonst selbst ein Treffer.
  const text = fixMojibake(raw).replace(/\r\n?/g, '\n')
    .replace(/^```[\s\S]*?^```\s*$/gm, '');
  if (!/^#\s*Verlauf/m.test(text) || !/^##\s*Sitzungen\s*$/m.test(text)) return null;

  const project = (text.match(/^#\s*Verlauf\s*[—–-]\s*(.+)$/m) || [, ''])[1].trim();
  const section = name => {
    const re = new RegExp(`^##\\s*${name}\\s*$`, 'm');
    const i = text.search(re);
    if (i < 0) return '';
    const rest = text.slice(i).replace(re, '');
    const next = rest.search(/^##\s+\S/m);
    return next < 0 ? rest : rest.slice(0, next);
  };

  const entries = [];
  const seen = new Set();
  const ENTRY = /^-\s*(?:`(\d{2}:\d{2})`\s*)?\[([^\]]+)\]\s*(?:\*\*([A-ZÄÖÜ]+)\*\*\s*)?([\s\S]*?)(?:\s*↳\s*(\S+))?\s*$/;

  // --- Sitzungen: Tagesköpfe liefern das Datum ---
  let day = null;
  for (const line of foldContinuations(section('Sitzungen'))){
    const head = line.match(/^###\s*(\d{4}-\d{2}-\d{2})/);
    if (head){ day = head[1]; continue; }
    const m = line.match(ENTRY);
    if (!m || !day) continue;
    const [, time, id, type, body, ref] = m;
    if (seen.has(id)) continue;
    seen.add(id);
    entries.push({
      id, type: (type || 'FUND').toUpperCase(), text: body.trim(),
      timestamp: `${day}T${time || '00:00'}:00`, ref: ref || undefined,
    });
  }

  // --- Wände: ohne Zeitstempel, Typ ergibt sich aus dem Abschnitt ---
  for (const line of foldContinuations(section('Wände'))){
    const m = line.match(ENTRY);
    if (!m) continue;
    const [, , id, type, body, ref] = m;
    if (seen.has(id)) continue;
    seen.add(id);
    entries.push({
      id, type: (type || 'WAND').toUpperCase(), text: body.trim(),
      timestamp: day ? `${day}T00:00:00` : undefined, ref: ref || undefined,
    });
  }

  if (!entries.length) return null;
  return parseOkfTyped(entries, { ...meta, folder: meta.folder || project });
}

const toTs = v => {
  if (v == null) return null;
  if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
  const t = Date.parse(v);
  return Number.isNaN(t) ? null : t;
};
const firstLine = (s, max = 120) => {
  const l = String(s).split('\n').find(p => p.trim()) || '';
  const c = l.trim().replace(/^[#*>\-\s]+/, '');
  return c.length > max ? c.slice(0, max - 1) + '…' : (c || 'Ohne Titel');
};

function autoTags(text){
  const t = text.toLowerCase();
  const hits = TAGS.filter(tag => t.includes(tag.replace('-', ' ')) || t.includes(tag));
  return hits.slice(0, 4);
}
/**
 * Heuristische Ampel für Roh-Chats ohne Auto-Tagger-Ergebnis.
 * Der echte Tagger (auto-tagger.js, Gemini) gewinnt immer — diese
 * Funktion greift nur, wenn keine Ampel importiert wurde.
 */
function guessAmpel(text){
  const t = text.toLowerCase();
  if (/\bfehler\b|error|exception|scheitert|blocker|sackgasse|funktioniert nicht|stack ?trace/.test(t)) return 'Rot';
  if (/\bzweifel\b|unsicher|risiko|offene frage|vielleicht|problem/.test(t))                            return 'Gelb';
  if (/funktioniert|gelöst|erfolgreich|fertig|läuft|bestanden|entschieden/.test(t))                     return 'Gruen';
  return null;
}

let _uid = 0;
/** Vereinheitlicht ein Chat-Objekt und leitet Kennzahlen ab. */
function normalizeChat(c){
  const turns = (c.turns || []).filter(t => t && (t.text || t.thought));
  const chars = turns.reduce((a,t) => a + t.text.length + (t.thought?.length || 0), 0);
  return {
    id: _uid++,
    title: c.title || 'Ohne Titel',
    url: c.url || '',
    modelId: MODEL_BY_ID.has(c.modelId) ? c.modelId : 'unbekannt',
    typeId: TYPE_BY_ID.has(c.typeId) ? c.typeId : 'CHAT',
    catId: CAT_BY_ID.has(c.catId) ? c.catId : 'chat',
    ampel: normAmpel(c.ampel) || guessAmpel(turns.map(t => t.text).join(' ').slice(0, 4000)),
    tags: [...new Set(c.tags || [])],
    ts: c.ts || Date.now(),
    turns,
    source: c.source || null,
    unstructured: !!c.unstructured,  // roher Verlauf ohne erkennbare Sprecherwechsel
    okfId: c.okfId || null,          // Original-ID aus data.okf.json (e01, e02 …)
    ref: c.ref || null,              // Verweis auf einen anderen Eintrag
    refBy: c.refBy || [],            // Einträge, die hierher verweisen
    msgs: turns.length,
    thoughts: turns.filter(t => t.thought).length,
    tokens: Math.round(chars / 3.6),     // grobe Schätzung: ~3,6 Zeichen je Token
  };
}

const USER_SNIPPETS = [
  'Kannst du dir das nochmal ansehen? Der Ansatz funktioniert, fühlt sich aber umständlich an.',
  'Ich brauche das ohne zusätzliche Abhängigkeit — geht das auch in reinem Vanilla-JS?',

  'Gib mir bitte die kürzeste Variante, die trotzdem lesbar bleibt.',
  'Das Ergebnis stimmt nicht ganz. Kannst du die Randfälle durchgehen?',
  'Bau das bitte so um, dass die Reihenfolge stabil bleibt.',
];
const AI_SNIPPETS = [
  'Der entscheidende Punkt ist die Reihenfolge: erst normalisieren, dann indexieren, erst danach filtern. Wenn du das umdrehst, musst du bei jedem Tastendruck neu aufbauen.',
  'Ich habe drei Varianten gegenübergestellt. Die einfachste kommt ohne zusätzliche Abhängigkeit aus und ist bei deiner Datenmenge schnell genug.',
  'Die Messung zeigt: rund 80 % der Laufzeit gehen für die Serialisierung drauf, nicht für die eigentliche Abfrage. Dort lohnt die Optimierung.',
  'Statt eines vollständigen Rewrites reicht ein dünner Adapter, der die alte Signatur auf die neue mappt. Das hält die Änderung lokal.',
  'Der Fehler liegt nicht im Code, sondern in der Annahme über das Zeitzonenverhalten der Eingabedaten. Sobald du lokal formatierst, verschwindet er.',
  'Als Faustregel: alles was pro Tastendruck läuft, sollte unter einer Millisekunde bleiben. Dein aktueller Scan liegt gut darunter.',
];

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildMockCorpus(n){
  const rnd = mulberry32(20260823);
  const pick = a => a[(rnd() * a.length) | 0];
  const pool = [];
  MODELS.forEach(m => { for (let i = 0; i < m.w; i++) pool.push(m.id); });
  const DAY = 86400000, now = Date.now();
  const out = [];

  for (let i = 0; i < n; i++){
    const r = rnd();
    const ts = now - Math.floor(r * r * 400) * DAY - Math.floor(rnd() * DAY);
    const turnCount = 2 + ((rnd() * 9) | 0) * 2;
    const turns = [];
    for (let t = 0; t < turnCount; t++){
      if (t % 2 === 0){
        turns.push({ role:'user', text: pick(USER_SNIPPETS), ts: ts + t * 90000, thought:null });
      } else {
        // in etwa jedem vierten Assistant-Turn ein Denkfluss, wie bei R1/o1-Modellen
        const withThought = rnd() < 0.25;
        turns.push({ role:'assistant', ts: ts + t * 90000,
          text: pick(AI_SNIPPETS) + '\n\n' + pick(AI_SNIPPETS),
          thought: withThought
            ? `Zuerst prüfen, ob das Problem überhaupt am Code liegt. ${pick(AI_SNIPPETS)} Also die einfachere Variante wählen.`
            : null });
      }
    }
    const tags = [];
    for (let t = 0, c = 1 + ((rnd()*3)|0); t < c; t++){ const g = pick(TAGS); if (!tags.includes(g)) tags.push(g); }

    out.push(normalizeChat({
      title: `${pick(TOPIC_VERBS)} ${pick(TOPIC_NOUNS)}`,
      url: '',
      modelId: pool[(rnd() * pool.length) | 0],
      catId: pick(CATEGORIES).id,
      typeId: pick(['CHAT','CHAT','CHAT','FUND','WEG','WAND','SETZUNG','ZWEIFEL','MOTIV']),
      ampel: pick(['Gruen','Gruen','Gelb','Rot','Blau',null]),
      tags, ts, turns,
    }));
  }
  return out;
}

/* ---------------------------------------------------------------
   Manuelle Metadaten: Tags, Ampel und Kategorie lassen sich pro
   Eintrag ändern. Der Chatinhalt bleibt unangetastet (read-only) —
   geändert wird nur die Verschlagwortung, genau wie es der
   Auto-Tagger mit `kategorie` tut. Gespeichert wird unter einem
   inhaltsbasierten Schlüssel, damit die Änderung einen Reimport
   derselben Datei übersteht.
   --------------------------------------------------------------- */
const OVERRIDE_KEY = 'promptengineer.overrides.v1';
let OVERRIDES = new Map();

function loadOverrides(){
  try { OVERRIDES = new Map(Object.entries(JSON.parse(localStorage.getItem(OVERRIDE_KEY) || '{}'))); }
  catch { OVERRIDES = new Map(); }
}
function saveOverrides(){
  try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(Object.fromEntries(OVERRIDES))); }
  catch { toast(t('storeFailed'), 'err'); }
}
/** Inhaltsbasierter, stabiler Schlüssel (Modell + Zeit + Titel), FNV-1a. */
function chatKey(c){
  const base = `${c.modelId}|${c.ts}|${c.title}`;
  let hash = 2166136261;
  for (let i = 0; i < base.length; i++){ hash ^= base.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  return (hash >>> 0).toString(36);
}
function applyOverride(c){
  const o = OVERRIDES.get(chatKey(c));
  if (!o) return c;
  if (o.tags)  c.tags  = o.tags;
  if (o.ampel !== undefined) c.ampel = o.ampel;
  if (o.catId) c.catId = o.catId;
  return c;
}
/** Übernimmt eine Änderung, speichert sie und baut den Index neu auf. */
function setOverride(c, patch){
  const key = chatKey(c);
  OVERRIDES.set(key, { ...(OVERRIDES.get(key) || {}), ...patch });
  saveOverrides();
  Object.assign(c, patch);
  reindex(CHATS);          // Tag-Universum und Facetten neu berechnen
  apply();
}

/* ═══════════════════════════════════════════════════════════════
   TEIL 4 · Index & Filter-Engine
   Vorberechnete Spalten → ein Filterlauf ist ein linearer Scan.
   ═══════════════════════════════════════════════════════════════ */

let CHATS = [];
let N = 0, HAY = [], TITLE_LC = [], TS = null;
let MODEL_IDX = null, TYPE_IDX = null, AMPEL_IDX = null, CAT_IDX = null, TAG_SETS = [];
let ALL_TAGS = [];
/* okfId → Index in CHATS, für den Strang im Baum (TEIL 8) — Nachschlagen
   von Vorgänger (ref) und Nachfolgern (refBy), unabhängig vom Filter. */
let OKFID_TO_IDX = new Map();

const MODEL_ORDER = MODELS.map(m => m.id);
const TYPE_ORDER  = OKF_TYPES.map(t => t.id);
const AMPEL_ORDER = AMPELN.map(a => a.id);
const CAT_ORDER   = CATEGORIES.map(c => c.id);

/* Einträge mit kritischen Funden werden in der Liste markiert. Geprüft
   wird nur einmal je Eintrag — die Kennzeichnung hängt am Inhalt, nicht
   an den Metadaten, und der Inhalt ist unveränderlich. */
let SECRET_CHATS = new Set();
const SECRET_CHECKED = new Set();

function markSecrets(chats){
  const high = SECRET_PATTERNS.filter(p => p.sev === 'high');
  for (const c of chats){
    if (SECRET_CHECKED.has(c.id)) continue;
    SECRET_CHECKED.add(c.id);
    const hay = c.title + '\n' +
      c.turns.map(t => t.text + (t.thought ? '\n' + t.thought : '')).join('\n');
    for (const p of high){
      p.re.lastIndex = 0;
      const m = p.re.exec(hay);
      if (m && !PLACEHOLDER.test(m[1] || m[0])){ SECRET_CHATS.add(c.id); break; }
    }
  }
}

function reindex(chats){
  CHATS = chats;
  N = chats.length;
  for (const c of chats) applyOverride(c);      // manuelle Tags/Ampel/Kategorie zuerst anwenden
  markSecrets(chats);
  HAY = new Array(N); TITLE_LC = new Array(N); TAG_SETS = new Array(N);
  TS = new Float64Array(N);
  MODEL_IDX = new Uint8Array(N); TYPE_IDX = new Uint8Array(N);
  AMPEL_IDX = new Uint8Array(N); CAT_IDX = new Uint8Array(N);

  const freq = new Map();
  for (let i = 0; i < N; i++){
    const c = chats[i];
    TITLE_LC[i] = c.title.toLowerCase();
    // Suchtext umfasst Titel, ALLE Turns inkl. Denkflüsse und Tags
    HAY[i] = (c.title + ' ' +
              c.turns.map(t => t.text + (t.thought ? ' ' + t.thought : '')).join(' ') + ' ' +
              c.tags.join(' ')).toLowerCase();
    TS[i] = c.ts;
    MODEL_IDX[i] = Math.max(0, MODEL_ORDER.indexOf(c.modelId));
    TYPE_IDX[i]  = Math.max(0, TYPE_ORDER.indexOf(c.typeId));
    AMPEL_IDX[i] = c.ampel ? AMPEL_ORDER.indexOf(c.ampel) + 1 : 0;   // 0 = ungetaggt
    CAT_IDX[i]   = Math.max(0, CAT_ORDER.indexOf(c.catId));
    TAG_SETS[i]  = new Set(c.tags);
    for (const t of c.tags) freq.set(t, (freq.get(t) || 0) + 1);
  }
  ALL_TAGS = [...freq.keys()].sort((a,b) => freq.get(b) - freq.get(a) || a.localeCompare(b));

  OKFID_TO_IDX = new Map();
  for (let i = 0; i < N; i++) if (chats[i].okfId) OKFID_TO_IDX.set(chats[i].okfId, i);
}

const TEXT_OPS = [
  { id:'contains',  label:{ en:'Contains',        de:'Enthält' } },
  { id:'ncontains', label:{ en:'Does not contain',de:'Enthält nicht' } },
  { id:'equals',    label:{ en:'Equals',          de:'Ist gleich' } },
  { id:'nequals',   label:{ en:'Does not equal',  de:'Ist ungleich' } },
  { id:'starts',    label:{ en:'Begins with',     de:'Beginnt mit' } },
  { id:'ends',      label:{ en:'Ends with',       de:'Endet mit' } },
  { id:'words',     label:{ en:'All words',       de:'Alle Wörter' } },
  { id:'regex',     label:{ en:'Regex',           de:'Regex' } },
];
const OP_BY_ID = new Map(TEXT_OPS.map(o => [o.id, o]));

const DATE_PRESETS = [
  { id:'all',   days:null, label:{ en:'All time',   de:'Gesamter Zeitraum' } },
  { id:'today', days:0,    label:{ en:'Today',      de:'Heute' } },
  { id:'24h',   days:1,    label:{ en:'24 hours',   de:'24 Stunden' } },
  { id:'7d',    days:7,    label:{ en:'7 days',     de:'7 Tage' } },
  { id:'30d',   days:30,   label:{ en:'30 days',    de:'30 Tage' } },
  { id:'90d',   days:90,   label:{ en:'90 days',    de:'90 Tage' } },
  { id:'365d',  days:365,  label:{ en:'12 months',  de:'12 Monate' } },
];

const SORTS = [
  { id:'new',    group:true,  label:{ en:'Newest first',  de:'Neueste zuerst' }, cmp:(a,b) => TS[b] - TS[a] },
  { id:'old',    group:true,  label:{ en:'Oldest first',  de:'Älteste zuerst' }, cmp:(a,b) => TS[a] - TS[b] },
  { id:'title',  group:false, label:{ en:'Title A–Z',     de:'Titel A–Z' },
    cmp:(a,b) => TITLE_LC[a] < TITLE_LC[b] ? -1 : TITLE_LC[a] > TITLE_LC[b] ? 1 : 0 },
  { id:'msgs',   group:false, label:{ en:'Most turns',    de:'Meiste Turns' },   cmp:(a,b) => CHATS[b].msgs - CHATS[a].msgs },
  { id:'tokens', group:false, label:{ en:'Largest chats', de:'Größte Chats' },   cmp:(a,b) => CHATS[b].tokens - CHATS[a].tokens },
];
const SORT_BY_ID = new Map(SORTS.map(s => [s.id, s]));

const state = {
  q:'', op:'contains',
  models:new Set(), types:new Set(), ampeln:new Set(), cats:new Set(), tags:new Set(),
  datePreset:'all', from:null, to:null,
  sort:'new',
};

let qError = false;
function buildMatcher(){
  qError = false;
  const raw = state.q.trim();
  if (!raw) return null;
  const q = raw.toLowerCase();
  switch (state.op){
    case 'contains':  return i => HAY[i].includes(q);
    case 'ncontains': return i => !HAY[i].includes(q);
    case 'equals':    return i => TITLE_LC[i] === q;
    case 'nequals':   return i => TITLE_LC[i] !== q;
    case 'starts':    return i => TITLE_LC[i].startsWith(q);
    case 'ends':      return i => TITLE_LC[i].endsWith(q);
    case 'words': {
      const w = q.split(/\s+/).filter(Boolean);
      return i => { const h = HAY[i]; for (const x of w) if (!h.includes(x)) return false; return true; };
    }
    case 'regex': {
      let re; try { re = new RegExp(raw, 'i'); } catch { qError = true; return null; }
      return i => re.test(HAY[i]);
    }
    default: return null;
  }
}

function dateBounds(){
  if (state.from != null || state.to != null)
    return { lo: state.from ?? -Infinity, hi: state.to ?? Infinity };
  const p = DATE_PRESETS.find(p => p.id === state.datePreset);
  if (!p || p.days == null) return { lo:-Infinity, hi:Infinity };
  if (p.days === 0){ const d = new Date(); d.setHours(0,0,0,0); return { lo:d.getTime(), hi:Infinity }; }
  return { lo: Date.now() - p.days * 86400000, hi: Infinity };
}

function maskOf(set, order){
  if (!set.size) return -1;
  let m = 0;
  for (const id of set){ const i = order.indexOf(id); if (i >= 0) m |= (1 << i); }
  return m;
}

function runFilter(skip){
  const match = buildMatcher();
  const { lo, hi } = dateBounds();
  const mMask = skip === 'models' ? -1 : maskOf(state.models, MODEL_ORDER);
  const tMask = skip === 'types'  ? -1 : maskOf(state.types,  TYPE_ORDER);
  const aMask = skip === 'ampeln' ? -1 : (state.ampeln.size
    ? [...state.ampeln].reduce((m,id) => m | (1 << (AMPEL_ORDER.indexOf(id) + 1)), 0) : -1);
  const cMask = skip === 'cats'   ? -1 : maskOf(state.cats, CAT_ORDER);
  const wantTags = skip === 'tags' ? null : (state.tags.size ? [...state.tags] : null);

  const out = [];
  for (let i = 0; i < N; i++){
    const t = TS[i];
    if (t < lo || t > hi) continue;
    if (mMask !== -1 && !(mMask & (1 << MODEL_IDX[i]))) continue;
    if (tMask !== -1 && !(tMask & (1 << TYPE_IDX[i]))) continue;
    if (aMask !== -1 && !(aMask & (1 << AMPEL_IDX[i]))) continue;
    if (cMask !== -1 && !(cMask & (1 << CAT_IDX[i]))) continue;
    if (wantTags){
      const bag = TAG_SETS[i];
      let ok = false;
      for (const t2 of wantTags) if (bag.has(t2)){ ok = true; break; }   // ODER
      if (!ok) continue;
    }
    if (match && !match(i)) continue;
    out.push(i);
  }
  return out;
}

function facetCounts(){
  const models = new Map(), types = new Map(), ampeln = new Map(), cats = new Map(), tags = new Map();
  for (const i of runFilter('models')){ const k = MODEL_ORDER[MODEL_IDX[i]]; models.set(k,(models.get(k)||0)+1); }
  for (const i of runFilter('types')) { const k = TYPE_ORDER[TYPE_IDX[i]];   types.set(k,(types.get(k)||0)+1); }
  for (const i of runFilter('cats'))  { const k = CAT_ORDER[CAT_IDX[i]];     cats.set(k,(cats.get(k)||0)+1); }
  for (const i of runFilter('ampeln')){ const k = AMPEL_IDX[i] ? AMPEL_ORDER[AMPEL_IDX[i]-1] : '_none';
                                        ampeln.set(k,(ampeln.get(k)||0)+1); }
  for (const i of runFilter('tags'))  { for (const t of TAG_SETS[i]) tags.set(t,(tags.get(t)||0)+1); }
  return { models, types, ampeln, cats, tags };
}

   TEIL 5 · Export
   Alle Formate arbeiten auf der AKTUELL GEFILTERTEN Menge.

const pad = n => String(n).padStart(2,'0');
const fmt = n => n.toLocaleString(LOCALE());
const stamp = ts => { const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}`; };
const isoLocal = ts => { const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

/** Technischer Zeitstempel je Eintrag: DD/MM/YYYY-hh/mm/ss.
    Bewusst in beiden Sprachen gleich — ein Format zum Ablesen und
    Vergleichen, kein Fließtext. */
const stampFull = ts => { const d = new Date(ts);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}-` +
         `${pad(d.getHours())}/${pad(d.getMinutes())}/${pad(d.getSeconds())}`; };
const dateTime = ts => { const d = new Date(ts);
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return LANG === 'de'
    ? `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}, ${time} Uhr`
    : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}, ${time}`; };

function filterSummary(){
  const p = [];
  const list = (key, set, nameOf) => { if (set.size) p.push(t(key) + ': ' + [...set].map(nameOf).join(', ')); };
  if (state.q) p.push(`${tx(OP_BY_ID.get(state.op).label)}: "${state.q}"`);
  list('sumModels', state.models, m => MODEL_BY_ID.get(m).name);
  list('sumTypes',  state.types,  x => tx(TYPE_BY_ID.get(x).short));
  list('sumCats',   state.cats,   c => tx(CAT_BY_ID.get(c).name));
  list('sumAmpeln', state.ampeln, a => tx(AMPEL_BY_ID.get(a).name));
  list('sumTags',   state.tags,   x => x);
  if (state.datePreset !== 'all' || state.from || state.to) p.push(t('chipRange') + ': ' + dateLabel());
  return p.length ? p.join(' · ') : t('expNoFilter');
}
