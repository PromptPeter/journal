      `- **${t('expCategory')}:** ${tx(CAT_BY_ID.get(c.catId).name)}` +
        (c.ampel ? ` · ${t('editAmpel')}: ${c.ampel}` : ''),
      c.typeId !== 'CHAT'
        ? `- **${t('expType')}:** \`${c.typeId}\` ${tx(TYPE_BY_ID.get(c.typeId).short)} — ` +
          `${tx(TYPE_BY_ID.get(c.typeId).desc)} (${tx(TYPE_BY_ID.get(c.typeId).q)})`
        : null,
      c.okfId ? `- **OKF-ID:** ${c.okfId}${c.ref ? ` → ${t('expPointsTo')} ${c.ref}` : ''}` : null,
      `- **${t('expTurns')}:** ${c.msgs} · **${t('expTokens')}:** ${fmt(c.tokens)}` +
        (c.thoughts ? ` · **${t('expThoughts')}:** ${c.thoughts}` : ''),
      c.tags.length ? `- **${t('expTags')}:** ${c.tags.map(x => '#'+x).join(' ')}` : null,
      c.url ? `- **${t('expSource')}:** ${c.url}` : null,
      '', `### ${t('expHistory')}`, '',
    );
    for (const turn of c.turns){
      head.push(`**${turn.role === 'user' ? t('roleUser') : t('roleAssistant')}**` +
                (turn.ts ? ` · ${dateTime(turn.ts)}` : ''), '');
      if (turn.thought)
        head.push(`<details><summary>${t('expReasoning')}</summary>`, '', turn.thought, '', '</details>', '');
      head.push(turn.text, '');
    }
    head.push('---', '');
  }
  return head.filter(l => l !== null).join('\n');
}

/* --- Klartext ------------------------------------------------ */
function toText(chats){
  const out = [`${t('expHeadline').toUpperCase()} — ${dateTime(Date.now())}`,
               `${t('expFilter')}: ${filterSummary()}`,
               `${t('expChats')}: ${chats.length}`, '='.repeat(72), ''];
  for (const c of chats){
    const m = MODEL_BY_ID.get(c.modelId);
    out.push(c.title, `${m.name} (${m.vendor})  |  ${dateTime(c.ts)}  |  ${tx(CAT_BY_ID.get(c.catId).name)}`,
             c.url ? `${t('expSource')}: ${c.url}` : null,
             c.tags.length ? `${t('expTags')}: ${c.tags.join(', ')}` : null,
             '-'.repeat(72));
    for (const turn of c.turns){
      out.push(`[${turn.role === 'user' ? 'USER' : 'ASSISTANT'}]${turn.ts ? ' ' + dateTime(turn.ts) : ''}`);
      if (turn.thought) out.push(`  <${t('expReasoning').toUpperCase()}> ${turn.thought}`);
      out.push(turn.text, '');
    }
    out.push('='.repeat(72), '');
  }
  return out.filter(l => l !== null).join('\n');
}

/* --- CSV (eine Zeile je Turn, Semikolon für Excel-DE) --------- */
function toCsv(chats){
  const q = v => { const s = String(v ?? '');
    return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const cols = LANG === 'de'
    ? ['chat_id','chat_titel','modell','anbieter','okf_typ','kategorie','ampel','tags','datum',
       'uhrzeit','timestamp_iso','quelle','turn_nr','rolle','zeichen','denkfluss','text']
    : ['chat_id','chat_title','model','vendor','okf_type','category','signal','tags','date',
       'time','timestamp_iso','source','turn_no','role','characters','reasoning','text'];
  const rows = [cols.join(';')];
  for (const c of chats){
    const m = MODEL_BY_ID.get(c.modelId), d = new Date(c.ts);
    c.turns.forEach((turn, i) => rows.push([
      c.id, q(c.title), m.name, m.vendor, c.typeId, tx(CAT_BY_ID.get(c.catId).name), c.ampel || '',
      q(c.tags.join(', ')), `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`,
      `${pad(d.getHours())}:${pad(d.getMinutes())}`, isoLocal(c.ts), q(c.url),
      i + 1, turn.role, turn.text.length, q(turn.thought || ''), q(turn.text),
    ].join(';')));
  }
  return '﻿' + rows.join('\r\n');    // BOM, damit Excel UTF-8 erkennt
}

/* --- JSON (volle Struktur) -----------------------------------
   Die Schlüssel sind bewusst englisch und sprachunabhängig — es
   ist ein Datenformat, das von Skripten gelesen wird, kein Text
   für die Anzeige.                                              */
function toJson(chats){
  return JSON.stringify({
    export:'PromptEngineer Journal', version:'1.0',
    created: isoLocal(Date.now()), filter: filterSummary(), count: chats.length,
    chats: chats.map(c => ({
      id:c.id, title:c.title, url:c.url,
      model:{ id:c.modelId, name:MODEL_BY_ID.get(c.modelId).name, vendor:MODEL_BY_ID.get(c.modelId).vendor },
      okf_type:c.typeId, category:c.catId, signal:c.ampel, tags:c.tags,
      okf_id:c.okfId, ref:c.ref,
      timestamp: isoLocal(c.ts), date: dateTime(c.ts),
      turns: c.turns.length, tokens_estimated: c.tokens,
      conversation: c.turns.map((turn,i) => ({
        no:i+1, role:turn.role, timestamp: turn.ts ? isoLocal(turn.ts) : null,
        thought_process: turn.thought || null, text:turn.text,
      })),
    })),
  }, null, 2);
}

/* --- OKF: raw.okf.json ---------------------------------------
   Flaches Array, Schema nach Googles OKF-Standard:
   { role, text, url, timestamp, llm, tags }
   Die Ampel des Auto-Taggers (Rot/Gelb/Gruen/Blau) steht als
   `ampel/<Wert>` in `tags`. Bis 24.08.2026 hieß das Feld `kategorie`
   (Richards Server, OKF_MD_LOG) — der Import liest beide Formen
   (ampelFromEntry()), geschrieben wird nur noch `tags`.            */
function toOkfRaw(chats){
  const entries = [];
  for (const c of chats){
    const m = MODEL_BY_ID.get(c.modelId);
    for (const t of c.turns){
      const e = {
        role: t.role,
        text: t.text,
        url: c.url || undefined,
        timestamp: isoLocal(t.ts || c.ts),
        llm: m.name,
      };
      if (c.ampel) e.tags = ['ampel/' + c.ampel];
      if (t.thought) e.thought_process = t.thought;   // Denkfluss, wie geplant
      entries.push(e);
    }
  }
  return JSON.stringify(entries, null, 2);
}

/* --- OKF: data.okf.json --------------------------------------
   Typisierte Ebene mit fortlaufenden IDs (e01, e02 …) und
   ref-Verkettung — Schema aus journal-store.js/addEntry().
   Turns eines Chats werden zu einem Strang verkettet:
   der erste Turn trägt den Chat-Typ, die folgenden verweisen
   per ref auf ihren Vorgänger.                                 */
function toOkfData(chats){
  const entries = [];
  let n = 0;
  const nextId = () => 'e' + String(++n).padStart(2, '0');

  for (const c of chats){
    const m = MODEL_BY_ID.get(c.modelId);

    // Stammt der Eintrag bereits aus OKF (data.okf.json oder VERLAUF.md),
    // wird er unverändert zurückgeschrieben: eigene ID, eigener ref.
    if (c.okfId){
      const e = {
        id: c.okfId,
        type: c.typeId === 'CHAT' ? 'FUND' : c.typeId,
        text: c.turns.map(t => t.text).join(' — '),   // "X" + "weil Y" → "X — weil Y"
        timestamp: isoLocal(c.ts),
      };
      if (c.ref) e.ref = c.ref;
      if (m.id !== 'unbekannt') e.llm = m.name;
      if (c.ampel) e.tags = ['ampel/' + c.ampel];
      const th = c.turns.find(t => t.thought);
      if (th) e.thought_process = th.thought;
      entries.push(e);
      continue;
    }

    // Sonst: die Turns eines Chats werden zu einem Strang verkettet
    let prev = null;
    c.turns.forEach((t, i) => {
      const id = nextId();
      const e = {
        id,
        // Erster Turn erbt den Chat-Typ, weitere sind FUND (Erkenntnis aus dem Verlauf)
        type: i === 0 ? (c.typeId === 'CHAT' ? 'FUND' : c.typeId) : 'FUND',
        text: t.text,
        timestamp: isoLocal(t.ts || c.ts),
      };
      if (prev) e.ref = prev;
      if (m.id !== 'unbekannt') e.llm = m.name;
      if (c.ampel) e.tags = ['ampel/' + c.ampel];
      if (t.thought) e.thought_process = t.thought;
      entries.push(e);
      prev = id;
    });
  }
  return JSON.stringify(entries, null, 2);
}

/* --- Verdichtung -------------------------------------------------
   Nach den Regeln aus md_files/SKILL.md, Abschnitt „Schicht 2":

     1. MOTIV ist unantastbar — nie verdichtet, nie umformuliert.
     2. Strang WEG → WAND: auf die WAND zusammengezogen, die WAND
        erbt das Weil des WEG.
     3. Strang WEG → SETZUNG: auf die SETZUNG zusammengezogen, die
        SETZUNG saugt die ursprüngliche Motivation auf.
     5. Offener ZWEIFEL verdichtet nie — bleibt wörtlich stehen.
     6. FUND überlebt nur, solange er trägt; durch eine spätere
        SETZUNG gegenstandslos gewordene FUNDe fallen weg.
     7. Folgenlose Einträge fallen weg — aber eine Sackgasse, die
        gegen etwas gestoßen ist, ist eine WAND und bleibt.
        „Nicht der Gang durch die Sackgasse bleibt, sondern die
        Wand an ihrem Ende."

   Regel 4 (aufgelöster ZWEIFEL wandert in die auflösende SETZUNG)
   braucht die Information, welche SETZUNG welchen ZWEIFEL auflöst.
   Die steht nur im Fließtext, nicht in den Daten — deshalb hier
   bewusst nicht automatisiert.

   Abweichung von compactor.js: dessen `isFolgenlos()` schützt nur
   MOTIV und kann damit WAND- und ZWEIFEL-Einträge entfernen, die
   nach SKILL.md stehenbleiben müssten. Maßgeblich ist SKILL.md.  */

/** Typen, die die Folgenlos-Regel niemals entfernen darf. */
const KEEP_ALWAYS = new Set(['MOTIV', 'WAND', 'ZWEIFEL']);

/* --- Altersstufen (SKILL.md, „Der Detailgrad verfällt mit dem Alter,
   das motivationale Gerüst nie") ------------------------------------

     laufende Sitzung  → alles, wörtlich
     letzte 2 Sitzungen→ Stränge zusammengezogen, Zeitstempel bleiben
     älter             → nur MOTIV, SETZUNG, WAND, offene ZWEIFEL,
                         Datum statt Uhrzeit
     viel älter        → dasselbe, Sitzungen eines Monats zu einem Block

   „Sitzung" ist ein Tag mit Einträgen, nicht ein Kalendertag: der
   jüngste vorhandene Tag gilt als der laufende. Damit funktioniert die
   Einstufung auch bei einem Datensatz, an dem seit Wochen niemand
   gearbeitet hat.                                                     */

const AGE_STAGES = [
  { id:'current', label:{ en:'current session',  de:'laufende Sitzung' } },
  { id:'recent',  label:{ en:'last 2 sessions',  de:'letzte 2 Sitzungen' } },
  { id:'older',   label:{ en:'older',            de:'älter' } },
  { id:'ancient', label:{ en:'much older',       de:'viel älter' } },
];
/** Das motivationale Gerüst, das auch in alten Stufen bleibt. */
const FRAME_TYPES = new Set(['MOTIV', 'SETZUNG', 'WAND']);
const ANCIENT_DAYS = 90;

const dayOfEntry = e => String(e.timestamp || '').slice(0, 10);

/** Ordnet jedem vorkommenden Tag seine Altersstufe zu. */
function stagesByDay(entries){
  const days = [...new Set(entries.map(dayOfEntry).filter(Boolean))].sort().reverse();
  const map = new Map();
  const newest = days[0] ? Date.parse(days[0] + 'T12:00:00') : Date.now();
  days.forEach((day, i) => {
    const ageDays = (newest - Date.parse(day + 'T12:00:00')) / 86400000;
    map.set(day, i === 0 ? 'current'
                : i <= 2 ? 'recent'
                : ageDays > ANCIENT_DAYS ? 'ancient' : 'older');
  });
  return map;
}

/**
 * Verdichtung mit Altersstufen. Die laufende Sitzung ist vor jeder
 * Regel geschützt — sie steht wörtlich, wie sie geschrieben wurde.
 * Zurück kommen die Einträge mit einem zusätzlichen `_stage`, das die
 * VERLAUF-Ausgabe für die Monatsblöcke braucht.
 */
function compactByAge(entries){
  const stages = stagesByDay(entries);
  const stageOf = e => stages.get(dayOfEntry(e)) || 'older';

  // Regeln laufen über den ganzen Graphen — Stränge kreuzen Tagesgrenzen.
  const protect = new Set(entries.filter(e => stageOf(e) === 'current').map(e => e.id));
  const compacted = compactOkf(entries, protect);

  const kept = compacted
    .filter(e => {
      const st = stageOf(e);
      if (st === 'current' || st === 'recent') return true;
      if (e.type === 'ZWEIFEL') return true;     // Regel 5: offener Zweifel bleibt immer
      return FRAME_TYPES.has(e.type);
    })
    .map(e => {
      const st = stageOf(e);
      // ältere Stufen führen nur noch das Datum
      const ts = (st === 'older' || st === 'ancient') ? dayOfEntry(e) : e.timestamp;
      return { ...e, timestamp: ts, _stage: st };
    });

  // Der Altersfilter entfernt weitere Einträge — Verweise erneut nachziehen,
  // diesmal gegen den bereits verdichteten Stand.
  return relinkRefs(kept, new Map(compacted.map(e => [e.id, e])));
}
function extractWeil(text){
  const m = String(text).match(/weil\s+(.+?)(?:\.|$)/i);
  return m ? m[1].trim() : text;
}
/**
 * Kurzform eines Eintragstexts ohne die "weil …"-Begründung — für die
 * Strang-Zusammenführung, damit die Begründung nicht doppelt im
 * zusammengeführten Text auftaucht (einmal als "Kurzform", einmal über
 * extractWeil()). Ohne Komma im Text (der Normalfall bei "X — weil Y")
 * wäre `text.split(',')[0]` sonst der gesamte Text inklusive Begründung.
 */
function stripWeilClause(text){
  const s = String(text).replace(/\s*[—-]?\s*weil\s+.+$/i, '').trim();
  return s || text;
}
/**
 * @param {Array}  entries  OKF-Einträge
 * @param {Set}    protect  IDs, die unverändert bleiben müssen
 *                          (die laufende Sitzung — sie steht wörtlich)
 */
function compactOkf(entries, protect = new Set()){
  const byId = new Map(entries.map(e => [e.id, e]));
  const incoming = new Map(), outgoing = new Map();
  for (const e of entries){ incoming.set(e.id, []); outgoing.set(e.id, []); }
  for (const e of entries){
    if (!e.ref) continue;
    outgoing.get(e.id).push(e.ref);
    if (!incoming.has(e.ref)) incoming.set(e.ref, []);
    incoming.get(e.ref).push(e.id);
  }

  /**
   * Folgt vom Strang-Anfang (z.B. einer WEG) den EINGEHENDEN Verweisen —
   * also dem, was Neueres auf sie aufbaut —, solange das eindeutig ist,
   * bis ein Eintrag vom Typ endType erreicht ist.
   *
   * `ref` zeigt immer vom neueren auf den älteren Eintrag. Eine WAND, die
   * aus einer WEG entsteht, verweist deshalb AUF die WEG (WAND.ref = WEG.id),
   * nicht umgekehrt. Wer von der WEG aus einen geschlossenen Strang zu ihrer
   * WAND finden will, muss also fragen "wer zeigt auf mich" (incoming), nicht
   * "worauf zeige ich" (outgoing) — sonst läuft die Suche in die eigene
   * Vergangenheit und kann die neuere WAND nie erreichen.
   *
   * Bestätigt an echten Projektdaten (23.08.2026): Mit der alten,
   * ausgehenden Richtung fand die Funktion auf `TestProjekt` selbst den
   * lehrbuchhaften Strang `WEG(e03) → WAND(e04)` nicht (4 Einträge blieben
   * 4). Mit `incoming` findet sie ihn im ersten Schritt.
   */
  const findStrand = (startId, endType) => {
    const seen = new Set(); const chain = []; let cur = startId;
    while (cur && byId.has(cur) && !seen.has(cur)){
      seen.add(cur); chain.push(cur);
      const ins = incoming.get(cur) || [];
      if (ins.length !== 1) return null;      // verzweigt oder toter Strang → nicht eindeutig
      const next = byId.get(ins[0]);
      if (!next) return null;
      if (next.type === endType) return { chain, endId: ins[0] };
      cur = ins[0];
    }
    return null;
  };

  const remove = new Set(), update = new Map();
  const drop = id => { if (!protect.has(id)) remove.add(id); };

  for (const e of entries){
    if (e.type !== 'WEG' || protect.has(e.id)) continue;
    const wand = findStrand(e.id, 'WAND');
    if (wand){
      const target = byId.get(wand.endId);
      if (!protect.has(wand.endId))
        update.set(wand.endId, `${target.text} (${stripWeilClause(e.text).split(',')[0]}, weil ${extractWeil(e.text)})`);
      for (const id of wand.chain) if (id !== wand.endId) drop(id);
      continue;
    }
    const setz = findStrand(e.id, 'SETZUNG');
    if (setz){
      const target = byId.get(setz.endId);
      if (!protect.has(setz.endId))
        update.set(setz.endId, `${target.text} (ursprünglich: ${e.text})`);
      for (const id of setz.chain) if (id !== setz.endId) drop(id);
    }
  }

  // Regel 6: FUND überlebt nur, solange er trägt
  let survivors = new Set(entries.filter(e => !remove.has(e.id)).map(e => e.id));
  for (const e of entries){
    if (remove.has(e.id) || protect.has(e.id) || e.type !== 'FUND') continue;
    const toSetzung = (outgoing.get(e.id) || []).some(r => byId.get(r)?.type === 'SETZUNG' && survivors.has(r));
    const referenced = (incoming.get(e.id) || []).some(id => survivors.has(id));
    if (!toSetzung && !referenced && (outgoing.get(e.id) || []).length === 0) drop(e.id);
  }

  // Regel 7: Folgenloses fällt weg — außer MOTIV, WAND und ZWEIFEL
  survivors = new Set(entries.filter(e => !remove.has(e.id)).map(e => e.id));
  for (const e of entries){
    if (remove.has(e.id) || protect.has(e.id) || KEEP_ALWAYS.has(e.type)) continue;
    const hasIn  = (incoming.get(e.id) || []).some(id => survivors.has(id));
    const hasOut = (outgoing.get(e.id) || []).length > 0;
    if (!hasIn && !hasOut) drop(e.id);
  }

  const kept = entries.filter(e => !remove.has(e.id))
                      .map(e => update.has(e.id) ? { ...e, text: update.get(e.id) } : { ...e });
  return relinkRefs(kept, byId);
}

/**
 * Hängt Verweise um, die auf verdichtete Einträge zeigen: gefolgt wird
 * der ref-Kette, bis ein überlebender Eintrag erreicht ist. Ein Verweis
 * ins Leere ist wertlos — er behauptet einen Eintrag, den es nicht mehr
 * gibt, und bricht die Argumentationsstränge, wegen derer die IDs
 * überhaupt existieren.
 * @param {Array} kept    die überlebenden Einträge (werden verändert)
 * @param {Map}   byIdAll alle Einträge vor der Verdichtung
 */
function relinkRefs(kept, byIdAll){
  const alive = new Set(kept.map(e => e.id));
  for (const e of kept){
    if (!e.ref) continue;
    let cur = e.ref, guard = 0;
    while (cur && !alive.has(cur) && guard++ < 32) cur = byIdAll.get(cur)?.ref;
    if (cur && alive.has(cur) && cur !== e.id) e.ref = cur;
    else delete e.ref;
  }
  return kept;
}

/** Verdichtung ohne Altersbezug — nur die Regeln 1–3, 5–7. */
function toOkfCompact(chats){
  return JSON.stringify(compactOkf(JSON.parse(toOkfData(chats))), null, 2);
}

/** Verdichtung samt Altersstufen, wie SKILL.md sie vorsieht. */
function toOkfAged(chats){
  const aged = compactByAge(JSON.parse(toOkfData(chats)))
    .map(({ _stage, ...e }) => e);        // Hilfsfeld gehört nicht in die Datei
  return JSON.stringify(aged, null, 2);
}

/* --- VERLAUF.md ----------------------------------------------
   Format aus compactor.js/buildVerlaufMd(): Kopf, offene
   Spannungen, Wände, dann Sitzungen nach Tagen gruppiert.       */
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = { en:['January','February','March','April','May','June','July',
                     'August','September','October','November','December'],
                 de:['Januar','Februar','März','April','Mai','Juni','Juli',
                     'August','September','Oktober','November','Dezember'] };

function toVerlaufMd(chats){
  const entries = compactByAge(JSON.parse(toOkfData(chats)));
  const of = t => entries.filter(e => e.type === t);
  const motiv = of('MOTIV')[0], setzungen = of('SETZUNG'), zweifel = of('ZWEIFEL'), waende = of('WAND');
  const last = setzungen[setzungen.length-1] || waende[waende.length-1] || entries[entries.length-1];

  const L = ['# Verlauf — Journal-Export', '', '## Kopf',
    '**Worum es geht:** ' + (motiv ? motiv.text : (chats[0]?.title || '—')),
    '**Warum überhaupt:** ' + (motiv ? extractWeil(motiv.text) : '—'),
    '**Wo wir stehen:** ' + (setzungen.length ? setzungen[setzungen.length-1].text : '—'),
    '**Woran zuletzt gearbeitet:** ' + (last ? last.text : '—')];
  if (zweifel.length) L.push('**Offen:** ' + zweifel.map(z => z.text).join('; '));

  L.push('', '## Offene Spannungen', '| # | Spannung | seit | Stand |', '|---|----------|------|-------|');
  zweifel.forEach((z, i) => L.push(`| S${i+1} | ${z.text} | ${(z.timestamp||'').slice(0,10) || '—'} | ungelöst |`));

  L.push('', '## Wände');
  for (const w of waende) L.push(`- [${w.id}] ${w.text}`);

  L.push('', '## Sitzungen', '');

  // Sitzungen der ältesten Stufe werden monatsweise zu einem Block
  // zusammengefasst; jüngere behalten ihren Tageskopf.
  const groups = new Map();
  for (const e of entries){
    const day = (e.timestamp || '').slice(0, 10) || 'unknown';
    const key = e._stage === 'ancient' ? day.slice(0, 7) : day;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }

  for (const key of [...groups.keys()].sort()){
    if (/^\d{4}-\d{2}$/.test(key)){                       // Monatsblock
      const [y, m] = key.split('-');
      L.push(`### ${key} — ${MONTHS[LANG][+m - 1]} ${y}`);
    } else if (/^\d{4}-\d{2}-\d{2}$/.test(key)){
      L.push(`### ${key} (${WEEKDAYS[new Date(key + 'T00:00:00').getDay()]})`);
    } else {
      L.push(`### ${key}`);
    }
    for (const e of groups.get(key)){
      // Ältere Stufen führen nur noch das Datum, keine Uhrzeit mehr
      const time = (e.timestamp || '').slice(11, 16);
      const mark = time ? `\`${time}\`` : `\`${(e.timestamp || '').slice(0, 10) || '—'}\``;
      let line = `- ${mark} [${e.id}] **${e.type}** ${e.text}`;
      if (e.ref) line += ` ↳${e.ref}`;
      L.push(line);
    }
    L.push('');
  }
  return L.join('\n');
}

/* --- NotebookLM ---------------------------------------------
   NotebookLM hat keine öffentliche Upload-API. Erzeugt wird eine
   quellenoptimierte Markdown-Datei (klare Überschriften, keine
   Deko), die immer als Download übergeben wird — nie automatisch
   an einen Server; hochgeladen wird nur von Hand.               */
function toNotebookLM(chats){
  const out = [
    `# ${t('nbTitle')}`, '',
    t('nbIntro', { d:dateTime(Date.now()), n:chats.length, f:filterSummary() }), '',
    t('nbNote'), '',
  ];
  chats.forEach((c, n) => {
    const m = MODEL_BY_ID.get(c.modelId);
    out.push(
      `---`, '', `## ${t('nbSource')} ${n+1}: ${c.title}`, '',
      `${t('expModel')}: ${m.name} · ${t('expDate')}: ${dateTime(c.ts)} · ` +
      `${t('expCategory')}: ${tx(CAT_BY_ID.get(c.catId).name)}` +
      (c.tags.length ? ` · ${t('nbTopics')}: ${c.tags.join(', ')}` : ''), '',
    );
    for (const turn of c.turns)
      out.push(`**${turn.role === 'user' ? t('roleUser') : t('roleAssistant')}:** ${turn.text}`, '');
  });
  return out.join('\n');
}

/* --- PDF: minimaler Writer, keine Bibliothek ------------------
   Helvetica + WinAnsi. Zeichen außerhalb von CP1252 (Emoji) sind
   im PDF nicht darstellbar und werden ersetzt.                  */
const HELV_W = (() => {
  const w = new Uint16Array(256).fill(556);
  const set = (s, v) => { for (const ch of s) w[ch.charCodeAt(0)] = v; };
  set(' !', 278); set('"', 355); set('#$', 556); set('%', 889); set('&', 667); set("'", 191);
  set('()', 333); set('*', 389); set('+', 584); set(',.', 278); set('-', 333); set('/', 278);
  set(':;', 278); set('<=>', 584); set('?', 556); set('@', 1015);
  set('ABDEHKNOPQRUX', 722); set('A', 667); set('B', 667); set('CG', 722); set('E', 667); set('F', 611);
  set('G', 778); set('I', 278); set('J', 500); set('K', 667); set('L', 556); set('M', 833);
  set('O', 778); set('Q', 778); set('S', 667); set('T', 611); set('V', 667); set('W', 944);
  set('X', 667); set('Y', 667); set('Z', 611);
  set('[]', 278); set('\\', 278); set('^', 469); set('_', 556); set('`', 333);
  set('abdeghnopqu', 556); set('c', 500); set('f', 278); set('ij', 222); set('k', 500); set('l', 222);
  set('m', 833); set('r', 333); set('s', 500); set('t', 278); set('v', 500); set('w', 722);
  set('x', 500); set('y', 500); set('z', 500);
  set('{}', 334); set('|', 260); set('~', 584);
  for (let i = 192; i < 256; i++) w[i] = i < 223 ? 700 : 556;   // Akzente ~ Grundbuchstaben
  return w;
})();

const CP1252 = { '€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'‰':137,'Š':138,'‹':139,
  'Œ':140,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153,'š':154,'›':155,'œ':156,'Ÿ':159 };

function toWinAnsi(str){
  const out = [];
  for (const ch of str){
    const c = ch.codePointAt(0);
    if (c === 9) { out.push(32,32); continue; }
    if (c < 32) continue;
    if (c < 256) { out.push(c); continue; }
    if (CP1252[ch] != null) { out.push(CP1252[ch]); continue; }
    if (c >= 0x1F000 || (c >= 0x2190 && c <= 0x2BFF)) continue;   // Emoji/Symbole verwerfen
    out.push(63);                                                  // '?'
  }
  return out;
}
const textWidth = (bytes, size) => {
  let w = 0; for (const b of bytes) w += HELV_W[b]; return w * size / 1000;
};

function wrapLine(str, size, maxW){
  const words = str.split(/(\s+)/);
  const lines = []; let cur = [];
  const widthOf = arr => textWidth(toWinAnsi(arr.join('')), size);
  for (const word of words){
    if (word === '') continue;
    cur.push(word);
    if (widthOf(cur) > maxW){
      cur.pop();
      if (cur.length) lines.push(cur.join('').trimEnd());
      // sehr langes Einzelwort hart brechen
      if (textWidth(toWinAnsi(word), size) > maxW){
        let buf = '';
        for (const ch of word){
          if (textWidth(toWinAnsi(buf + ch), size) > maxW){ lines.push(buf); buf = ch; }
          else buf += ch;
        }
        cur = buf ? [buf] : [];
      } else cur = [word.trimStart()];
    }
  }
  if (cur.join('').trim()) lines.push(cur.join('').trimEnd());
  return lines.length ? lines : [''];
}

function toPdf(chats){
  const PW = 595.28, PH = 841.89, M = 56;          // A4 in pt
  const MAXW = PW - 2 * M;
  const pages = [];
  let ops = [], y = PH - M;

  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = PH - M; };
  const esc = bytes => { const o = [];
    for (const b of bytes){ if (b === 40 || b === 41 || b === 92) o.push(92); o.push(b); } return o; };

  function line(str, { size = 10, lead = 14, bold = false, gap = 0, color = null } = {}){
    for (const raw of String(str).split('\n')){
      for (const l of wrapLine(raw, size, MAXW)){
        if (y - lead < M) newPage();
        y -= lead;
        const bytes = esc(toWinAnsi(l));
        const str8 = bytes.map(b => String.fromCharCode(b)).join('');
        ops.push(`BT /F${bold ? 2 : 1} ${size} Tf ${color || '0 0 0'} rg ${M} ${y.toFixed(2)} Td (${str8}) Tj ET`);
      }
    }
    y -= gap;
  }
  function rule(){ if (y - 10 < M) newPage(); y -= 8;
    ops.push(`0.78 0.80 0.85 RG 0.6 w ${M} ${y.toFixed(2)} m ${(PW-M).toFixed(2)} ${y.toFixed(2)} l S`); y -= 8; }

  line(t('expHeadline'), { size:19, lead:24, bold:true });
  line(`${dateTime(Date.now())}  ·  ${chats.length} ${t('expChats')}`, { size:9.5, lead:14, color:'0.42 0.45 0.5' });
  line(`${t('expFilter')}: ${filterSummary()}`, { size:9.5, lead:13, color:'0.42 0.45 0.5', gap:6 });
  rule();

  for (const c of chats){
    if (y < M + 90) newPage();
    const m = MODEL_BY_ID.get(c.modelId);
    line(c.title, { size:13, lead:18, bold:true, gap:1 });
    line(`${m.name} (${m.vendor})  ·  ${dateTime(c.ts)}  ·  ${tx(CAT_BY_ID.get(c.catId).name)}` +
         (c.typeId !== 'CHAT' ? `  ·  ${c.typeId}` : '') +
         (c.ampel ? `  ·  ${t('editAmpel')}: ${c.ampel}` : '') +
         (c.tags.length ? `  ·  ${c.tags.map(x => '#'+x).join(' ')}` : ''),
         { size:8.5, lead:12, color:'0.42 0.45 0.5' });
    if (c.url) line(c.url, { size:8.5, lead:12, color:'0.30 0.45 0.85', gap:4 });
    for (const turn of c.turns){
      line(turn.role === 'user' ? 'USER' : 'ASSISTANT',
           { size:8, lead:13, bold:true, color: turn.role === 'user' ? '0.20 0.36 0.80' : '0.10 0.55 0.38' });
      if (turn.thought)
        line(`[${t('expReasoning')}] ${turn.thought}`, { size:8.5, lead:11.5, color:'0.48 0.42 0.66', gap:3 });
      line(turn.text, { size:9.5, lead:13.2, gap:6 });
    }
    rule();
  }
  newPage();

  /* --- PDF-Objekte zusammensetzen (Byte-genaue xref) --- */
  const enc = new TextEncoder();
  const chunks = []; let len = 0;
  const push = s => { const b = typeof s === 'string' ? enc.encode(s) : s; chunks.push(b); len += b.length; };

  const objCount = 3 + pages.length * 2;    // Catalog, Pages, Font + je Seite Page+Content
  const offsets = new Array(objCount + 1).fill(0);
  const startObj = n => { offsets[n] = len; push(`${n} 0 obj\n`); };
  const endObj = () => push('endobj\n');

  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

  startObj(1); push('<< /Type /Catalog /Pages 2 0 R >>\n'); endObj();

  const kids = pages.map((_, i) => `${4 + i * 2} 0 R`).join(' ');
  startObj(2);
  push(`<< /Type /Pages /Count ${pages.length} /Kids [${kids}] >>\n`); endObj();

  startObj(3);
  push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n'); endObj();

  pages.forEach((pageOps, i) => {
    const pageNo = 4 + i * 2, contentNo = pageNo + 1;
    startObj(pageNo);
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] ` +
         `/Resources << /Font << /F1 3 0 R /F2 3 0 R >> >> /Contents ${contentNo} 0 R >>\n`);
    endObj();

    const body = pageOps.join('\n') + '\n';
    const bytes = new Uint8Array(body.length);
    for (let k = 0; k < body.length; k++) bytes[k] = body.charCodeAt(k) & 0xff;
    startObj(contentNo);
    push(`<< /Length ${bytes.length} >>\nstream\n`);
    push(bytes);
    push('\nendstream\n'); endObj();
  });

  const xref = len;
  let table = `xref\n0 ${objCount + 1}\n0000000000 65535 f \n`;
  for (let n = 1; n <= objCount; n++) table += String(offsets[n]).padStart(10,'0') + ' 00000 n \n';
  push(table);
  push(`trailer\n<< /Size ${objCount + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  const all = new Uint8Array(len);
  let p = 0; for (const b of chunks){ all.set(b, p); p += b.length; }
  return all;
}

/* ═══════════════════════════════════════════════════════════════
   Geheimnis-Prüfung vor dem Export
   Chatverläufe enthalten regelmäßig Zugangsdaten — im Journal
   selbst ist das unkritisch, weil alles lokal bleibt. Kritisch
   wird es in dem Moment, in dem etwas das Gerät verlässt: beim
   Hochladen zu NotebookLM oder beim Weitergeben einer Exportdatei.
   Deshalb wird vor jedem Export geprüft, vor dem NotebookLM-Weg
   ohne Ausnahme.
   ═══════════════════════════════════════════════════════════════ */

const SECRET_PATTERNS = [
  // --- Zugangsdaten: eindeutig, hohe Dringlichkeit ---
  // sk-proj-… enthält Bindestriche, deshalb _- im Zeichensatz
  { id:'openai',   sev:'high', re:/\bsk-(?!ant-)[A-Za-z0-9_-]{20,}/g,
    label:{ en:'OpenAI API key',        de:'OpenAI-API-Schlüssel' } },
  { id:'anthropic',sev:'high', re:/\bsk-ant-[A-Za-z0-9_-]{20,}/g,
    label:{ en:'Anthropic API key',     de:'Anthropic-API-Schlüssel' } },
  // kein \b am Ende: - und _ sind keine Wortgrenzen
  { id:'google',   sev:'high', re:/\bAIza[0-9A-Za-z_-]{30,45}/g,
    label:{ en:'Google API key',        de:'Google-API-Schlüssel' } },
  { id:'github',   sev:'high', re:/\bgh[pousr]_[A-Za-z0-9]{30,}\b/g,
    label:{ en:'GitHub token',          de:'GitHub-Token' } },
  { id:'slack',    sev:'high', re:/\bxox[baprs]-[A-Za-z0-9-]{10,}\b/g,
    label:{ en:'Slack token',           de:'Slack-Token' } },
  { id:'aws',      sev:'high', re:/\b(?:AKIA|ASIA)[0-9A-Z]{16}\b/g,
    label:{ en:'AWS access key',        de:'AWS-Zugangsschlüssel' } },
  { id:'jwt',      sev:'high', re:/\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b/g,
    label:{ en:'JWT',                   de:'JWT' } },
  { id:'privkey',  sev:'high', re:/-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----/g,
    label:{ en:'Private key',           de:'Privater Schlüssel' } },
  { id:'conn',     sev:'high', re:/\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp):\/\/[^\s:@/]+:[^\s@/]{3,}@/gi,
    label:{ en:'Connection string with password', de:'Verbindungszeichenfolge mit Passwort' } },
  { id:'bearer',   sev:'high', re:/\bBearer\s+[A-Za-z0-9._~+/-]{20,}={0,2}/g,
    label:{ en:'Bearer token',          de:'Bearer-Token' } },
  { id:'assign',   sev:'high',
    re:/\b(?:api[_-]?key|apikey|access[_-]?token|auth[_-]?token|client[_-]?secret|password|passwort|passwd)\b\s*[:=]\s*["']?([A-Za-z0-9_\-./+]{12,})["']?/gi,
    label:{ en:'Assigned credential',   de:'Zugewiesene Zugangsdaten' } },

  // --- Personenbezogenes: mittlere Dringlichkeit ---
  { id:'email',    sev:'medium', re:/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g,
    label:{ en:'Email address',         de:'E-Mail-Adresse' } },
  { id:'iban',     sev:'medium', re:/\b[A-Z]{2}\d{2}(?:[ ]?[A-Z0-9]{4}){3,7}\b/g,
    label:{ en:'IBAN',                  de:'IBAN' } },
  // Nach der Vorwahl muss ein Trenner stehen — sonst gilt jede lange
  // Ziffernfolge in einem Token als Telefonnummer
  { id:'phone',    sev:'medium', re:/(?:\+49[\s/-]?|\b0)\d{2,5}[\s)/-]\s?\d{3,}(?:[\s-]?\d{2,})?/g,
    label:{ en:'Phone number',          de:'Telefonnummer' } },

  // --- Hinweise: niedrige Dringlichkeit ---
  { id:'winpath',  sev:'low', re:/\b[A-Za-z]:\\Users\\[^\\\s"']{2,}/g,
    label:{ en:'Local path with user name', de:'Lokaler Pfad mit Benutzername' } },
  { id:'ip',       sev:'low', re:/\b(?:\d{1,3}\.){3}\d{1,3}\b/g,
    label:{ en:'IP address',            de:'IP-Adresse' } },
];

const SEV_ORDER = { high:0, medium:1, low:2 };
/** Offensichtlich harmlose Treffer aussortieren. */
const FALSE_POSITIVE = /^(?:0\.0\.0\.0|127\.0\.0\.1|255\.255\.255\.255|1\.2\.3\.4|192\.168\.\d+\.\d+|localhost)$/;
const PLACEHOLDER = /^(?:sk-xxx+|dein[_-]?\w+|your[_-]?\w+|<[^>]+>|\.{3,}|x{6,}|placeholder|beispiel\S*|example\S*)$/i;

/**
 * Durchsucht Chats nach Zugangsdaten und personenbezogenen Angaben.
 * @returns {{findings:Array, byChat:Map, high:number}}
 */
function scanSecrets(chats){
  const findings = [];
  const byChat = new Map();

  for (const c of chats){
    const haystacks = [['Titel', c.title]];
    c.turns.forEach((t, i) => {
      haystacks.push([`Turn ${i + 1}`, t.text]);
      if (t.thought) haystacks.push([`Turn ${i + 1} · Denkfluss`, t.thought]);
    });

    for (const [where, text] of haystacks){
      if (!text) continue;
      for (const p of SECRET_PATTERNS){
        p.re.lastIndex = 0;
        let m;
        while ((m = p.re.exec(text)) !== null){
          const hit = m[1] || m[0];
          if (FALSE_POSITIVE.test(hit) || PLACEHOLDER.test(hit)) continue;
          if (p.id === 'ip' && !/^\d/.test(hit)) continue;
          findings.push({
            chat: c, chatId: c.id, where, pattern: p, sev: p.sev,
            raw: m[0], value: hit,
            context: text.slice(Math.max(0, m.index - 30), m.index + m[0].length + 30).replace(/\s+/g, ' '),
          });
          if (!byChat.has(c.id)) byChat.set(c.id, []);
          byChat.get(c.id).push(p.id);
        }
      }
    }
  }

  findings.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
  return { findings, byChat, high: findings.filter(f => f.sev === 'high').length };
}

/** Ersetzt gefundene Werte durch Platzhalter — Struktur bleibt lesbar. */
function maskSecrets(text, minSev = 'medium'){
  let out = String(text);
  for (const p of SECRET_PATTERNS){
    if (SEV_ORDER[p.sev] > SEV_ORDER[minSev]) continue;
    out = out.replace(p.re, m => {
      const keep = m.slice(0, Math.min(4, m.length));
      return `${keep}${'•'.repeat(Math.min(12, Math.max(4, m.length - 4)))}[${p.id}]`;
    });
  }
  return out;
}

/** Liefert eine Kopie der Chats mit maskierten Inhalten. */
function maskChats(chats, minSev = 'medium'){
  return chats.map(c => ({
    ...c,
    title: maskSecrets(c.title, minSev),
    turns: c.turns.map(t => ({
      ...t,
      text: maskSecrets(t.text, minSev),
      thought: t.thought ? maskSecrets(t.thought, minSev) : null,
    })),
  }));
}

/* --- ZIP: minimaler Writer, keine Bibliothek ------------------
   Nur Methode 0 („gespeichert"), keine Kompression — der Code
   bleibt kurz und der Inhalt im Archiv lesbar. Dateinamen als
   UTF-8, angezeigt über Bit 11 der allgemeinen Flags.           */
const CRC32_TABLE = (() => {
  const tab = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tab[i] = c >>> 0;
  }
  return tab;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/** @param {Array<{path:string, text:string}>} files  @returns {Uint8Array} */
function zipBundle(files, ts){
  const enc = new TextEncoder();
  const d = new Date(ts);
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

  const parts = [], central = [];
  let offset = 0;

  for (const f of files){
    const name = enc.encode(f.path);
    const data = enc.encode(f.text);
    const crc = crc32(data);

    const local = new Uint8Array(30 + name.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);            // benötigte Version
    lv.setUint16(6, 0x0800, true);        // Bit 11: Name ist UTF-8
    lv.setUint16(8, 0, true);             // Methode 0 = gespeichert
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true);
    local.set(name, 30);
    parts.push(local, data);

    const cen = new Uint8Array(46 + name.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);            // erzeugt von
    cv.setUint16(6, 20, true);            // benötigte Version
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);       // Versatz des lokalen Kopfes
    cen.set(name, 46);
    central.push(cen);

    offset += local.length + data.length;
  }

  const cenSize = central.reduce((n, c) => n + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cenSize, true);
  ev.setUint32(16, offset, true);

  const all = [...parts, ...central, end];
  const out = new Uint8Array(all.reduce((n, x) => n + x.length, 0));
  let at = 0;
  for (const x of all){ out.set(x, at); at += x.length; }
  return out;
}

/* --- LLM-Wiki-Bündel (Karpathy-Muster) ------------------------
   Dreiteilung: `raw/` unveränderlich, `wiki/` verdichtet,
   `CLAUDE.md` als Schema. Verlässt die Seite als ZIP, weil ein
   file://-Dokument kein Verzeichnis schreiben kann. Entpackt ist
   derselbe Baum zugleich ein OKF-Bündel nach Googles Spezifikation:
   YAML-Frontmatter je Datei, `index.md` als Einstieg, `log.md` als
   Verlauf, `ref` als Markdown-Link auf die Zieldatei.            */

const UMLAUT = { 'ä':'ae','ö':'oe','ü':'ue','ß':'ss','Ä':'ae','Ö':'oe','Ü':'ue' };

/** Dateinamen-tauglicher Kurzname: ASCII, klein, Bindestriche. */
function slugify(s, max = 48){
  const out = String(s)
    .replace(/[äöüßÄÖÜ]/g, ch => UMLAUT[ch])
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, max)
    .replace(/-+$/, '');
  return out || 'ohne-titel';
}

/** Eine Rohdatei je Chat. */
function vaultRawDoc(c){
  const m = MODEL_BY_ID.get(c.modelId);
  const turns = c.turns;
  const L = ['---',
    `title: ${JSON.stringify(c.title)}`,
    `llm: ${m.name}`,
    `timestamp: ${isoLocal(c.ts)}`];
  // Ampel und Schlagworte laufen nach OKF gemeinsam in `tags`;
  // der Präfix hält auseinander, aus welcher Dimension ein Tag stammt.
  const tags = [...(c.ampel ? [`ampel/${c.ampel}`] : []), ...c.tags];
  if (tags.length) L.push(`tags: [${tags.join(', ')}]`);
  if (c.url) L.push(`url: ${c.url}`);
  if (c.okfId) L.push(`okf: ${c.okfId}`);
  L.push('---', '', `# ${c.title}`, '');

  for (const turn of turns){
    L.push(`**${turn.role === 'user' ? t('roleUser') : t('roleAssistant')}**` +
           (turn.ts ? ` · ${dateTime(turn.ts)}` : ''), '');
    if (turn.thought)
      L.push(`<details><summary>${t('expReasoning')}</summary>`, '', turn.thought, '', '</details>', '');
    L.push(turn.text, '');
  }
  return L.join('\n');
}

/** Eine Wiki-Datei je verdichtetem Eintrag, ref und Gegenrichtung als [[…]]. */
function vaultEntryDoc(e, incoming){
  const ty = TYPE_BY_ID.get(e.type) || TYPE_BY_ID.get('CHAT');
  const L = ['---', `id: ${e.id}`, `type: ${e.type}`, `timestamp: ${e.timestamp}`];
  if (e.llm) L.push(`llm: ${e.llm}`);
  if (e.tags?.length) L.push(`tags: [${e.tags.join(', ')}]`);
  if (e.ref) L.push(`ref: ${e.ref}`);
  L.push('---', '', `# ${e.id} · ${tx(ty.short)}`, '', `*${tx(ty.q)}*`, '', e.text, '');
  if (e.thought_process)
    L.push(`<details><summary>${t('expReasoning')}</summary>`, '', e.thought_process, '', '</details>', '');
  if (e.ref) L.push(`${t('expPointsTo')}: [${e.ref}](${e.ref}.md)`, '');
  if (incoming.length)
    L.push(`${t('refByTitle')}: ${incoming.map(id => `[${id}](${id}.md)`).join(' · ')}`, '');
  return L.join('\n');
}

/** Einstieg ins Wiki: offene Spannungen, Wände, dann Sitzungen nach Tag. */
function vaultIndexDoc(entries){
  const link = e => `- [${e.id}](${e.id}.md) **${e.type}** ${firstLine(e.text, 90)}`;
  const pick = ty => entries.filter(e => e.type === ty);
  const doubts = pick('ZWEIFEL'), walls = pick('WAND');

  const L = [`# ${t('vaultIndexTitle')}`, '', `## ${t('vaultTensions')}`, ''];
  L.push(...(doubts.length ? doubts.map(link) : [`*${t('vaultNone')}*`]), '',
         `## ${t('vaultWalls')}`, '',
         ...(walls.length ? walls.map(link) : [`*${t('vaultNone')}*`]), '',
         `## ${t('vaultSessions')}`, '');

  const byDay = new Map();
  for (const e of entries){
    const day = String(e.timestamp).slice(0, 10);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(e);
  }
  for (const day of [...byDay.keys()].sort().reverse()){
    L.push('', `### ${day}`, '');
    for (const e of byDay.get(day)) L.push(link(e));
  }
  return L.join('\n');
}

/** Das Schema, dem beide Ebenen folgen — `CLAUDE.md` im Wurzelverzeichnis. */
function vaultSchemaDoc(entries, chats){
  const L = [`# ${t('vaultTitle')}`, '', t('vaultIntro'), '',
             `## ${t('vaultLayout')}`, '', '```',
             `CLAUDE.md      ${t('vaultLaySchema')}`,
             `raw/           ${t('vaultLayRaw')}`,
             `wiki/          ${t('vaultLayWiki')}`,
             `wiki/index.md  ${t('vaultLayIndex')}`,
             `wiki/log.md    ${t('vaultLayLog')}`,
             '```', '',
             `## ${t('vaultTypesHead')}`, '',
             `| \`type\` | ${t('expType')} | ${t('vaultQuestion')} |`, '|---|---|---|'];
  for (const ty of OKF_TYPES){
    if (ty.id === 'CHAT') continue;
    L.push(`| \`${ty.id}\` | ${tx(ty.desc)} | ${tx(ty.q)} |`);
  }
  L.push('', t('vaultTypesNote'), '',
         `## ${t('vaultRulesHead')}`, '', t('vaultRulesBody'), '',
         `## ${t('vaultContents')}`, '',
         `- \`raw/\` — ${chats.length}`,
         `- \`wiki/\` — ${entries.length}`,
         `- ${t('expFilter')}: ${filterSummary()}`,
         `- ${t('expCreated')}: ${isoLocal(Date.now())}`);
  return L.join('\n');
}

function toKarpathyVault(chats){
  // wiki/ trägt die altersverdichtete Ebene, wie SKILL.md sie vorsieht
  const aged = compactByAge(JSON.parse(toOkfData(chats))).map(({ _stage, ...e }) => e);

  const incoming = new Map();
  for (const e of aged){
    if (!e.ref) continue;
    if (!incoming.has(e.ref)) incoming.set(e.ref, []);
    incoming.get(e.ref).push(e.id);
  }

  const files = [{ path:'CLAUDE.md', text: vaultSchemaDoc(aged, chats) }];

  const used = new Set();
  for (const c of chats){
    const base = `${isoLocal(c.ts).slice(0,10)}_${MODEL_BY_ID.get(c.modelId).id}_${slugify(c.title)}`;
    let name = base, n = 1;
    while (used.has(name)) name = `${base}-${++n}`;
    used.add(name);
    files.push({ path:`raw/${name}.md`, text: vaultRawDoc(c) });
  }

  for (const e of aged)
    files.push({ path:`wiki/${e.id}.md`, text: vaultEntryDoc(e, incoming.get(e.id) || []) });
  files.push({ path:'wiki/index.md', text: vaultIndexDoc(aged) });
  files.push({ path:'wiki/log.md',   text: toVerlaufMd(chats) });

  return zipBundle(files, Date.now());
}

/* --- Download-Helfer ----------------------------------------- */
function download(filename, data, mime){
  const blob = data instanceof Uint8Array
    ? new Blob([data], { type: mime })
    : new Blob([data], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  const scan = scanSecrets(chats);

}

/* ---------- Chat einfügen (Paste-Import) -----------------------------
   Ersetzt die alte, dauerhaft im Hintergrund mitschneidende Extension:
   der Nutzer loggt sich selbst beim Anbieter ein, kopiert den sichtbaren
   Verlauf von Hand (oder per Ein-Klick-Lesezeichen, das nur in diesem
   Moment läuft) und fügt ihn hier ein. Kein Server, kein Konto, keine
   gespeicherten Zugangsdaten — die Anbieter-Wahl dient nur dem Parser,
   nicht dem Zugriff auf die Seite selbst.                              */
let pasteDlg = null;
function closePasteDialog(){
  if (!pasteDlg) return;
  const el = pasteDlg; pasteDlg = null;
  document.removeEventListener('keydown', pasteKey, true);
  el.classList.remove('open');
  setTimeout(() => el.remove(), 200);

function pasteKey(e){ if (e.key === 'Escape'){ e.stopPropagation(); closePasteDialog(); } }

/** Zeichenanzahl/Tokenschätzung/Zähler nach einer Turns-Änderung neu ziehen. */
function recomputeDerived(c){
  const chars = c.turns.reduce((a,t) => a + t.text.length + (t.thought?.length || 0), 0);
  c.msgs = c.turns.length;
  c.thoughts = c.turns.filter(t => t.thought).length;
  c.tokens = Math.round(chars / 3.6);
}

/**
 * Fügt einen frisch eingefügten Chat ein oder ergänzt einen bestehenden
 * um nur die neuen Turns — erkannt über chatKey() (Modell+Startzeit+Titel
 * bleiben bei einer fortgesetzten Unterhaltung gleich) plus einem
 * Textvergleich der einzelnen Turns, da eingefügter Text keine
 * verlässlichen Einzel-Zeitstempel mitbringt.
 * @returns {{added:number, mode:'merged'|'new'|'none'}}
 */
function mergeOrAddChat(fresh){
  const key = chatKey(fresh);
  const existing = CHATS.find(c => chatKey(c) === key);

  if (!existing){
    reindex([...CHATS, fresh].sort((a,b) => b.ts - a.ts));
    return { added: fresh.turns.length, mode:'new' };
  }

  const known = new Set(existing.turns.map(t => t.text));
  const freshTurns = fresh.turns.filter(t => !known.has(t.text));
  if (!freshTurns.length) return { added:0, mode:'none' };

  existing.turns.push(...freshTurns);
  recomputeDerived(existing);
  reindex(CHATS);
  return { added: freshTurns.length, mode:'merged' };
}

/**
 * "Chat holen" — Lesezeichen-Skript, läuft nur bei manuellem Klick auf der

 * nachgeladene alte Nachrichten im DOM erscheinen, und kopiert den Text in
 * die Zwischenablage — bereit für "Chat einfügen". Anbieterunabhängig
 * (sucht den Scrollbereich per Heuristik statt über feste CSS-Klassen),
 * bricht deshalb nicht bei jedem UI-Update eines Anbieters. Unterscheidet
 * dabei bewusst den breiten Gesprächsbereich von einer schmalen
 * Chat-Listen-Seitenleiste (beide sind oft scrollbar) über eine
 * Mindestbreite — sonst würde bei manchen Anbietern die Seitenleiste
 * statt des eigentlichen Verlaufs gescrollt und kopiert (am 25.08.2026
 * bei Gemini beobachtet: "nur die letzte Session" statt des ganzen Chats).
 * Quelle/Kommentare: tools/bookmarklet-import.js. Diese Zeile ist die
 * minifizierte Fassung derselben Datei.
 */
const BOOKMARKLET_HREF = `javascript:(function () { 'use strict'; var MAX_STABLE = 5; var MAX_ITER = 90; var DELAY_MS = 500; function findScrollable() { var candidates = []; var all = document.querySelectorAll('*'); var minWidth = Math.min(480, window.innerWidth * 0.4); var minHeight = window.innerHeight * 0.5; for (var i = 0; i < all.length; i++) { var el = all[i]; var cs; try { cs = getComputedStyle(el); } catch (e) { continue; } if (!/(auto|scroll)/.test(cs.overflowY)) continue; if (el.clientHeight < minHeight) continue; if (el.clientWidth < minWidth) continue; candidates.push(el); } if (!candidates.length) return document.scrollingElement || document.documentElement; candidates = candidates.filter(function (el) { return !candidates.some(function (other) { return other !== el && other.contains(el); }); }); candidates.sort(function (a, b) { return (b.clientWidth * b.clientHeight) - (a.clientWidth * a.clientHeight); }); return candidates[0]; } function showBanner(msg, isError) { var b = document.createElement('div'); b.textContent = msg; b.style.cssText = 'position:fixed;top:16px;right:16px;z-index:2147483647;' + 'background:' + (isError ? '#7a1f1f' : '#111') + ';color:#fff;padding:10px 16px;' + 'border-radius:8px;font:14px/1.4 -apple-system,Segoe UI,sans-serif;' + 'box-shadow:0 4px 16px rgba(0,0,0,.35);max-width:340px'; document.body.appendChild(b); setTimeout(function () { b.remove(); }, 5000); } function copyOrPrompt(text) { if (!text || !text.trim()) { showBanner('Kein Text gefunden — bitte manuell markieren und kopieren.', true); return; } if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then( function () { showBanner('✓ ' + text.length + ' Zeichen kopiert — zurück zum Journal wechseln und in "Chat einfügen" einfügen.'); }, function () { window.prompt('Kopieren automatisch fehlgeschlagen — Text ist unten markiert, Strg+C drücken:', text); } ); } else { window.prompt('Text manuell kopieren (Strg+C):', text); } } function extractAndCopy(container) { var raw = container.innerText || container.textContent || ''; var cleaned = raw.replace(/\\n{3,}/g, '\\n\\n').trim(); copyOrPrompt(cleaned); } function run() { var container = findScrollable(); var lastHeight = -1, stableCount = 0, iter = 0; showBanner('Lade vollständigen Verlauf … bitte kurz warten.'); function tick() { container.scrollTop = 0; var h = container.scrollHeight; if (h === lastHeight) stableCount++; else stableCount = 0; lastHeight = h; iter++; if (stableCount >= MAX_STABLE || iter >= MAX_ITER) { extractAndCopy(container); } else { setTimeout(tick, DELAY_MS); } } tick(); } run(); })();`;

/**
 * Kern der Chat-Einfüge-Logik: Text + Anbieter -> geparst, dedupliziert,
 * eingehängt, Anzeige aktualisiert, Meldung gezeigt. Von zwei Stellen
 * genutzt: dem "Chat einfügen"-Dialog (Text von Hand eingefügt) und der
 * Browser-Erweiterung (Text kommt automatisch vom Lesezeichen-Skript,
 * über eine window.postMessage-Brücke — siehe Handler weiter unten).
 * @returns {boolean} true, wenn erkennbarer Chat-Text vorlag
 */
function importChatText(raw, modelId){
  if (!raw || !raw.trim()){ toast(t('pasteEmpty'), 'err'); return false; }

  const chat = parseChatMarkdown(raw, { folder: modelId, filename:'Eingefügter Chat', ts: Date.now() });
  if (!chat){ toast(t('pasteNoText'), 'err'); return false; }
  if (modelId && MODEL_BY_ID.has(modelId)) chat.modelId = modelId;

  const { added, mode } = mergeOrAddChat(chat);
  resetFilters(false);
  apply();
  updateCorpusLine();

  if (mode === 'none') toast(t('pasteNoNew'), 'ok');
  else if (mode === 'merged') toast(t('pasteAddedNew', { n: added }), 'ok');
  else toast(t('pasteImported', { n: added }), 'ok');
  return true;
}

/**
 * Brücke zur Browser-Erweiterung: deren Content-Script auf dieser Seite
 * läuft in einer eigenen, isolierten JS-Welt und kann diese Funktionen
 * nicht direkt aufrufen — postMessage ist der dafür vorgesehene Weg
 * zwischen Content-Script und der echten Seite. Prüft die Quelle
 * (nur die eigene Seite selbst, kein anderer Frame) und den erwarteten
 * Nachrichtentyp, bevor irgendetwas verarbeitet wird.
 */
window.addEventListener('message', e => {
  if (e.source !== window) return;
  if (!e.data || e.data.type !== 'okf-import-chat') return;
  importChatText(e.data.text, e.data.modelId);
});

   ═══════════════════════════════════════════════════════════════ */

let openPop = null;

class Popover {
  constructor(trigger, render, opts = {}){
    this.trigger = trigger; this.render = render; this.opts = opts;
    this.el = null; this.cursor = -1;
    trigger.addEventListener('click', e => { e.stopPropagation(); this.toggle(); });
    trigger.addEventListener('keydown', e => { if (e.key === 'ArrowDown' && !this.el){ e.preventDefault(); this.open(); } });
  }
  toggle(){ this.el ? this.close() : this.open(); }
  open(){
    if (openPop && openPop !== this) openPop.close();
    openPop = this;
    const el = document.createElement('div');
    el.className = 'pop'; el.setAttribute('role','dialog');
    if (this.opts.width) el.style.minWidth = this.opts.width + 'px';
    document.body.append(el); this.el = el;
    this.trigger.setAttribute('aria-expanded','true');
    this.paint(); this.position();
    requestAnimationFrame(() => el.classList.add('open'));

    this._onDoc = e => { if (!el.contains(e.target) && !this.trigger.contains(e.target)) this.close(); };
    this._onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); this.close(true); return; } this.navigate(e); };
    this._onScroll = () => this.position();
    document.addEventListener('pointerdown', this._onDoc, true);
    document.addEventListener('keydown', this._onKey, true);
    window.addEventListener('resize', this._onScroll);
    window.addEventListener('scroll', this._onScroll, true);
    const f = el.querySelector('input'); if (f) f.focus();
  }
  paint(){
    if (!this.el) return;
    const sc = this.el.querySelector('.pop-list'); const top = sc ? sc.scrollTop : 0;
    const act = document.activeElement;
    const keep = act && act.tagName === 'INPUT' && this.el.contains(act)
      ? { val:act.value, sel:act.selectionStart } : null;
    this.el.innerHTML = '';
    this.render(this.el, this);
    const s2 = this.el.querySelector('.pop-list'); if (s2 && top) s2.scrollTop = top;
    if (keep){ const i = this.el.querySelector('input');
      if (i){ i.value = keep.val; i.focus(); i.setSelectionRange(keep.sel, keep.sel); } }
    this.position();
  }
  position(){
    if (!this.el) return;
    const r = this.trigger.getBoundingClientRect(), el = this.el;
    el.style.maxHeight = '';
    const h = el.offsetHeight, w = el.offsetWidth, gap = 8;
    const below = window.innerHeight - r.bottom - gap, above = r.top - gap;
    let top;
    if (h <= below || below >= above){ top = r.bottom + gap; el.style.maxHeight = Math.max(160, below) + 'px'; }
    else { top = Math.max(gap, r.top - gap - h); el.style.maxHeight = Math.max(160, above) + 'px'; }
    let left = this.opts.alignRight ? r.right - w : r.left;
    left = Math.min(Math.max(8, left), window.innerWidth - w - 8);
    el.style.top = top + 'px'; el.style.left = left + 'px';
  }
  navigate(e){
    if (!['ArrowDown','ArrowUp','Enter','Home','End'].includes(e.key)) return;
    const opts = [...this.el.querySelectorAll('.opt')];
    if (!opts.length) return;
    if (e.key === 'Enter'){ if (this.cursor >= 0 && opts[this.cursor]){ e.preventDefault(); opts[this.cursor].click(); } return; }
    e.preventDefault();
    if (e.key === 'Home') this.cursor = 0;
    else if (e.key === 'End') this.cursor = opts.length - 1;
    else this.cursor = e.key === 'ArrowDown' ? (this.cursor + 1) % opts.length
                                             : (this.cursor - 1 + opts.length) % opts.length;
    opts.forEach((o,i) => o.classList.toggle('cursor', i === this.cursor));
    opts[this.cursor].scrollIntoView({ block:'nearest' });
  }
  close(refocus){
    if (!this.el) return;
    const el = this.el; this.el = null; this.cursor = -1;
    if (openPop === this) openPop = null;
    this.trigger.setAttribute('aria-expanded','false');
    document.removeEventListener('pointerdown', this._onDoc, true);
    document.removeEventListener('keydown', this._onKey, true);
    window.removeEventListener('resize', this._onScroll);
    window.removeEventListener('scroll', this._onScroll, true);
    el.classList.remove('open');
    setTimeout(() => el.remove(), 160);
    if (refocus) this.trigger.focus();
  }
}

function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

function multiSelectPop(trigger, cfg){
  let draft = null, query = '';
  const pop = new Popover(trigger, (el, api) => {
    if (!draft) draft = new Set(cfg.get());
    const counts = FACETS[cfg.facet] || new Map();
    const all = cfg.options();
    const q = query.trim().toLowerCase();
    const visible = q ? all.filter(o => o.label.toLowerCase().includes(q)) : all;

    if (cfg.searchable) el.append(searchField(t(cfg.searchKey || 'searchIn'), v => { query = v; api.paint(); }));

    const list = h('ul', { class:'pop-list', role:'listbox', 'aria-multiselectable':'true' });
    if (!q){
      const total = [...counts.values()].reduce((a,b) => a+b, 0);
      const allOn = draft.size === 0;
      list.append(h('li', {}, h('button', {
        class:'opt', role:'option', 'aria-checked': allOn ? 'true' : 'mixed',
        onClick: () => { draft = new Set(); api.paint(); },
      },
        h('span', { class:'cb', html: allOn ? '<svg width="11" height="11"><use href="#i-check"/></svg>'
                                            : '<svg width="11" height="11"><use href="#i-minus"/></svg>' }),
        h('span', { class:'label' }, t(cfg.allKey)),
        h('span', { class:'n' }, fmt(total)))));
      list.append(h('li', { class:'pop-sep' }));
    }
    if (!visible.length){
      list.append(h('li', { class:'pop-empty' }, t('noMatches')));
    } else for (const o of visible){
      const on = draft.has(o.id);
      list.append(h('li', {}, h('button', {
        class: o.q ? 'opt rich' : 'opt', role:'option',
        'aria-checked': String(on), title:o.title || null,
        onClick: () => { on ? draft.delete(o.id) : draft.add(o.id); api.paint(); },
      },
        h('span', { class:'cb', html:'<svg width="11" height="11"><use href="#i-check"/></svg>' }),
        o.color ? h('span', { class:'dot', style:`background:${o.color}` }) : null,
        h('span', { class:'label' }, o.label,
          o.desc ? h('span', { class:'desc' }, o.desc) : null,
          o.q    ? h('span', { class:'lead-q' }, o.q) : null),
        h('span', { class:'n' }, fmt(counts.get(o.id) || 0)))));
    }
    el.append(list);
    el.append(h('div', { class:'pop-sep' }));
    el.append(h('div', { class:'pop-foot' },
      h('span', { class:'fill' }, draft.size ? t('nSelected', { n:draft.size }) : t('noRestriction')),
      h('button', { class:'btn btn-ghost', onClick: () => { draft = null; pop.close(true); } }, t('cancel')),
      h('button', { class:'btn btn-primary', onClick: () => {
        cfg.set(new Set(draft)); draft = null; pop.close(true); apply();
      } }, t('applyBtn'))));
  }, { width: cfg.width || 250 });

  const orig = pop.close.bind(pop);
  pop.close = r => { draft = null; query = ''; orig(r); };
  return pop;
}

/* ═══════════════════════════════════════════════════════════════
   TEIL 8 · Inline-Baum: Gesprächsverlauf im selben Frame
   Klick auf einen Journaleintrag klappt darunter einen Baum auf:
       Chat
        ├─ 1 USER      Frage …        (klickbar → Volltext)
        ├─ 2 ASSISTANT Antwort …
        └─ …
   Der Baum wird erst beim ersten Öffnen gebaut (lazy) und danach
   im DOM behalten, damit erneutes Auf-/Zuklappen sofort geht.
   ═══════════════════════════════════════════════════════════════ */

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/** Sehr leichte Markdown-Darstellung im Turn-Text (bewusst minimal). */
function renderTurnText(s){
  return escapeHtml(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .split('\n')
    .map(l => /^\s*[*\-•]\s+/.test(l) ? `<span class="li">${l.replace(/^\s*[*\-•]\s+/, '')}</span>` : l)
    .join('\n');
}

/** Zeile zum Bearbeiten von Tags, Ampel und Kategorie. */
function metaEditor(c, rerenderBar){
  const tagRow = h('div', { class:'edit-tags' });

  const refresh = () => {
    tagRow.innerHTML = '';
    for (const tag of c.tags){
      tagRow.append(h('span', { class:'etag' }, '#' + tag,
        h('button', { class:'x', 'aria-label':t('removeTag', { t:tag }), title:t('removeTag', { t:tag }),
          onClick: () => { setOverride(c, { tags: c.tags.filter(x => x !== tag) }); refresh(); } },
          icon('i-x', 10))));
    }
    tagRow.append(input, list);
  };

  const list = h('datalist', { id:`tags-${c.id}` },
    ...ALL_TAGS.map(x => h('option', { value:x })));

  const commit = () => {
    const raw = input.value.trim().replace(/^#/, '').toLowerCase();
    if (!raw) return;
    // mehrere Tags auf einmal: "a, b, c"
    const neu = raw.split(/[,;]/).map(s => s.trim()).filter(Boolean);
    const merged = [...new Set([...c.tags, ...neu])];
    input.value = '';
    if (merged.length !== c.tags.length){ setOverride(c, { tags: merged }); refresh(); }
  };
  const input = h('input', { class:'tag-input', type:'text', list:`tags-${c.id}`,
    placeholder:t('addTag'), autocomplete:'off', spellcheck:'false',
    onKeydown: e => {
      if (e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if (e.key === 'Backspace' && !e.currentTarget.value && c.tags.length){
        setOverride(c, { tags: c.tags.slice(0, -1) }); refresh();
      }
    },
    onBlur: commit });

  const ampelSel = h('select', { class:'edit-sel', 'aria-label':t('editAmpel'),
    onChange: e => { setOverride(c, { ampel: e.target.value || null }); rerenderBar?.(); } },
    h('option', { value:'' }, t('noAmpel')),
    ...AMPELN.map(a => h('option', { value:a.id, ...(c.ampel === a.id ? { selected:true } : {}) },
      `${tx(a.name)} — ${tx(a.desc)}`)));

  const catSel = h('select', { class:'edit-sel', 'aria-label':t('editCat'),
    onChange: e => { setOverride(c, { catId: e.target.value }); rerenderBar?.(); } },
    ...CATEGORIES.map(k => h('option', { value:k.id, ...(c.catId === k.id ? { selected:true } : {}) }, tx(k.name))));

  refresh();
  return h('div', { class:'meta-edit' },
    h('span', { class:'edit-label' }, t('editTags')), tagRow,
    h('span', { class:'edit-label' }, t('editAmpel')), ampelSel,
    h('span', { class:'edit-label' }, t('editCat')), catSel,
    OVERRIDES.has(chatKey(c))
      ? h('button', { class:'mini', title:t('revertT'),
          onClick: () => {
            OVERRIDES.delete(chatKey(c)); saveOverrides();
            toast(t('reverted'), 'ok');
            apply();
          } }, t('revert'))
      : null);
}

/** Baut den Baum für einen Chat (Kopfzeile + Äste). */
/**
 * Strang um einen OKF-Eintrag: Vorgänger über `ref` (links, älter),
 * dieser Eintrag hervorgehoben, Nachfolger über `refBy` (rechts, neuer —
 * mehrere, falls verschiedene Einträge auf denselben Vorgänger zeigen).
 * Zeitachse waagerecht, damit Verdichtungsstränge (WEG→WAND, WEG→SETZUNG)
 * als das lesbar werden, was sie sind: eine Spur, kein Netz.
 */
function buildStrand(c){
  if (!c.okfId) return null;

  const ancestors = [];
  let cur = c.ref, guard = 0;
  while (cur && OKFID_TO_IDX.has(cur) && guard++ < 8){
    const p = CHATS[OKFID_TO_IDX.get(cur)];
    ancestors.unshift(p);
    cur = p.ref;
  }
  const children = (c.refBy || [])
    .map(id => OKFID_TO_IDX.has(id) ? CHATS[OKFID_TO_IDX.get(id)] : null)
    .filter(Boolean);
  if (!ancestors.length && !children.length) return null;

  const pill = (chat, current) => {
    const ty = TYPE_BY_ID.get(chat.typeId) || TYPE_BY_ID.get('CHAT');
    return h('button', {
      class:'strand-pill', type:'button', style:`color:${ty.color}`,
      disabled: current || undefined,
      title: current ? t('strandCurrent')
                     : `${chat.okfId} · ${tx(ty.short)} — ${firstLine(chat.turns[0]?.text || '', 140)}`,
      onClick: current ? null : () => jumpToChat(chat),
    },
      h('span', { class:'strand-id' }, chat.okfId),
      h('span', { class:'strand-ty' }, tx(ty.short)));
  };
  const arrow = () => h('span', { class:'strand-arrow', 'aria-hidden':'true' }, '→');

  const row = h('div', { class:'strand-row' });
  ancestors.forEach(p => { row.append(pill(p, false)); row.append(arrow()); });
  row.append(pill(c, true));
  if (children.length){
    row.append(arrow());
    row.append(children.length === 1
      ? pill(children[0], false)
      : h('div', { class:'strand-fan' }, ...children.map(ch => pill(ch, false))));
  }

  return h('div', { class:'strand' }, h('span', { class:'strand-caption' }, t('strandLabel')), row);
}

/** Springt zu einem anderen Eintrag: aufklappen, ins Bild scrollen; liegt
    er außerhalb des aktuellen Filters, wird der Filter dafür zurückgesetzt. */
function jumpToChat(chat){
  const i = CHATS.indexOf(chat);
  if (i < 0) return;

  const settle = () => {
    const k = results.indexOf(i);
    if (k < 0) return false;
    while (shown <= k) renderPage();
    const entry = listEl.querySelector(`.entry[data-ci="${i}"]`);
    if (!entry) return false;
    if (!entry.classList.contains('open')) toggleEntry(entry, i);
    entry.scrollIntoView({ behavior:'smooth', block:'center' });
    entry.classList.add('jump-flash');
    setTimeout(() => entry.classList.remove('jump-flash'), 1100);
    return true;
  };

  if (settle()) return;
  resetFilters();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (settle()) toast(t('jumpFilterReset'), 'ok');
  }));
}

/** Sammelt Dateien inkl. ganzer Ordner (webkitGetAsEntry). */
async function collectFiles(dt){
  const items = [...(dt.items || [])];
  const entries = items.map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];

  const files = [];
  const walk = entry => new Promise(res => {
    if (entry.isFile) entry.file(f => { f._path = entry.fullPath; files.push(f); res(); }, res);
    else if (entry.isDirectory){
      const reader = entry.createReader();
      const readAll = () => reader.readEntries(async batch => {
        if (!batch.length) return res();
        await Promise.all(batch.map(walk));
        readAll();
      }, res);
      readAll();
    } else res();
  });
  await Promise.all(entries.map(walk));
  return files;
}

async function importFiles(files){
  const usable = files.filter(f => /\.(md|markdown|txt|json)$/i.test(f.name));
  if (!usable.length){ toast(t('importNothing'), 'err'); return; }

  const imported = [];
  let failed = 0;
  for (const file of usable){
    try {
      const raw = await file.text();
      const path = file._path || file.webkitRelativePath || '';
      const folder = path.split('/').filter(Boolean).slice(-2, -1)[0] || '';
      const meta = { filename:file.name, path, folder, ts:file.lastModified || Date.now() };

      if (/\.json$/i.test(file.name)){
        imported.push(...parseOkfJson(raw, meta));
      } else {
        // VERLAUF.md hat ein eigenes Format und wird zuerst geprüft
        const verlauf = parseVerlaufMd(raw, meta);
        if (verlauf){ imported.push(...verlauf); }
        else { const c = parseChatMarkdown(raw, meta); if (c) imported.push(c); else failed++; }
      }
    } catch { failed++; }
  }

  if (!imported.length){
    toast(t('importFailed', { n:failed }), 'err');
    return;
  }
  if (mockMode){ CHATS = []; mockMode = false; }        // Mock beim ersten echten Import ersetzen
  reindex([...CHATS, ...imported].sort((a,b) => b.ts - a.ts));
  resetFilters(false);
  apply();
  updateCorpusLine();
  toast((imported.length === 1 ? t('importOkOne') : t('importOk', { n:imported.length })) +
        (failed ? t('importSkipped', { n:failed }) : ''), 'ok');
}

function toast(msg, kind = ''){

    kind === 'ok' ? h('span', { class:'ic' }, icon('i-check', 13)) : null, msg);
  toastsEl.append(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 3600);
}

function highlight(text, q){
  const safe = escapeHtml(text);
  if (!q || state.op === 'regex' || state.op.startsWith('n')) return safe;
  const needle = q.trim(); if (!needle) return safe;
  const re = new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

/* Datumsformate hängen an der gewählten Sprache und werden beim
   Sprachwechsel neu gebaut. */
let REL, DAY_FMT, DATE_FMT;
function buildFormatters(){
  REL      = new Intl.RelativeTimeFormat(LOCALE(), { numeric:'auto' });
  DAY_FMT  = new Intl.DateTimeFormat(LOCALE(), { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  DATE_FMT = new Intl.DateTimeFormat(LOCALE(), { day:'2-digit', month:'short', year:'numeric' });
}
buildFormatters();

function dayKey(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dayLabel(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0)  return t('dayToday');
  if (diff === -1) return t('dayYesterday');
  if (diff > -7)   return REL.format(diff, 'day');
  return DAY_FMT.format(ts);
}

/** Rendert die nächste Seite; bei Sortierung nach Datum mit Tages-Gruppen. */
function renderPage(){
  const grouped = SORT_BY_ID.get(state.sort).group;
  const end = Math.min(shown + PAGE, results.length);
  const frag = document.createDocumentFragment();

  let group = null, groupKey = listEl.lastElementChild?.dataset?.day || null;
  if (grouped && groupKey) group = listEl.lastElementChild.querySelector('.list');

  for (let k = shown; k < end; k++){
    const i = results[k];
    if (grouped){
      const key = dayKey(CHATS[i].ts);
      if (key !== groupKey){
        groupKey = key;
        const list = h('div', { class:'list' });
        group = list;
        frag.append(h('section', { class:'daygroup', 'data-day':key },
          h('div', { class:'dayhead' },
            h('h2', {}, dayLabel(CHATS[i].ts)),
            h('span', { class:'rule' }),
            h('span', { class:'n', 'data-count':key }, '')),
          list));
      }
      group.append(cardOf(i));
    } else {
      if (!group){ group = h('div', { class:'list' }); frag.append(group); }
      group.append(cardOf(i));
    }
  }
  listEl.append(frag);
  shown = end;

  // Tageszähler nachtragen
  if (grouped) for (const sec of listEl.querySelectorAll('.daygroup')){
    const n = sec.querySelectorAll('.card').length;
    const el = sec.querySelector('.n');
    if (el) el.textContent = n === 1 ? t('oneChat') : t('nChats', { n });
  }

  moreEl.hidden = shown >= results.length;
  moreEl.textContent = shown >= results.length ? '' : t('nMore', { n:fmt(results.length - shown) });
}

new IntersectionObserver(e => { if (e[0].isIntersecting && shown < results.length) renderPage(); },
  { rootMargin:'600px' }).observe(sentinel);

function labelFor(trigger, base, set, nameOf){
  const el = trigger.querySelector('.lbl');
  trigger.querySelector('.count')?.remove();
  if (!set.size){ el.textContent = base; trigger.classList.remove('is-active'); }
  else if (set.size === 1){ el.textContent = nameOf([...set][0]); trigger.classList.add('is-active'); }
  else {
    el.textContent = base; trigger.classList.add('is-active');
    trigger.insertBefore(h('span', { class:'count' }, String(set.size)), trigger.querySelector('.chev'));
  }
}
function dateLabel(){
  if (state.from != null || state.to != null){
    const f  = state.from != null ? DATE_FMT.format(state.from) : '…';
    const to = state.to   != null ? DATE_FMT.format(state.to)   : t('today');

       + state.ampeln.size + state.tags.size

/* --- Hauptzyklus --------------------------------------------- */
let rafPending = false;
function apply(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; doApply(); });
}

function doApply(){
  const t0 = performance.now();
  results = runFilter(null);
  results.sort(SORT_BY_ID.get(state.sort).cmp);
  FACETS = facetCounts();
  const ms = performance.now() - t0;

  labelFor(document.getElementById('t-model'), t('allModels'),     state.models, id => MODEL_BY_ID.get(id).name);
  labelFor(document.getElementById('t-type'),  t('allTypes'),      state.types,  id => tx(TYPE_BY_ID.get(id).short));
  labelFor(document.getElementById('t-cat'),   t('allCategories'), state.cats,   id => tx(CAT_BY_ID.get(id).name));
  labelFor(document.getElementById('t-ampel'), t('allAmpeln'),     state.ampeln, id => tx(AMPEL_BY_ID.get(id).name));
  labelFor(document.getElementById('t-tag'),   t('allTags'),       state.tags,   x  => '#' + x);
  dateTrigger.querySelector('.lbl').textContent = dateLabel();
  dateTrigger.classList.toggle('is-active', state.datePreset !== 'all' || state.from != null || state.to != null);
  sortTrigger.querySelector('.lbl').textContent = tx(SORT_BY_ID.get(state.sort).label);
  exportTrigger.querySelector('.lbl').textContent = t('export');
  opTrigger.textContent = tx(OP_BY_ID.get(state.op).label);
  qInput.closest('.searchbox').classList.toggle('invalid', qError);

  exportTrigger.querySelector('.count')?.remove();
  if (results.length && results.length !== N)
    exportTrigger.insertBefore(h('span', { class:'count' }, fmt(results.length)), exportTrigger.querySelector('.chev'));

  renderChips();
  document.getElementById('reset').hidden = activeFilterCount() === 0;
  if (openPop) openPop.paint();

  const turnCount = results.reduce((a,i) => a + CHATS[i].msgs, 0);
  countEl.innerHTML = results.length
    ? t('countLine', { n:fmt(results.length), total:fmt(N), t:fmt(turnCount) })
    : t('countNone');
  timingEl.textContent = `${ms.toFixed(1)} ms`;

  listEl.innerHTML = ''; shown = 0;
  if (!results.length){
    moreEl.hidden = true;
    listEl.append(h('div', { class:'empty' },
      h('h3', {}, t('emptyTitle')),
      h('p', {}, t('emptyText')),
      h('button', { class:'btn btn-primary', onClick: () => resetFilters() }, t('emptyBtn'))));
  } else renderPage();
}

  opTrigger.title = t('searchOpTitle');
  document.querySelector('#reset span').textContent = t('reset');
  importTrigger.querySelector('.lbl').textContent = t('importBtn');
  document.querySelector('#dropzone h3').textContent = t('dropTitle');
  document.querySelector('#dropzone p').textContent  = t('dropSub');

  for (const b of document.querySelectorAll('#langswitch button'))
    b.classList.toggle('on', b.dataset.lang === LANG);
  applyDensity();               // Titel der Dichte-Knöpfe hängen an der Sprache

  updateCorpusLine();
  pingServer();
  if (openPop) openPop.close();
  apply();                       // baut Trigger-Labels, Chips und Liste neu
}

function setLang(lang){
  if (!LANGS.includes(lang) || lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  applyLang();
}

document.getElementById('langswitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (btn) setLang(btn.dataset.lang);
});

/* --- Start --------------------------------------------------- */
loadOverrides();
reindex(buildMockCorpus(1200));
document.getElementById('srv-txt').textContent = t('srvChecking');
applyLang();
setInterval(pingServer, 30000);
</script>
</body>
</html>
